[program:medtracker-bot]
command=/usr/bin/python3 /path/to/app.py
directory=/path/to/
autostart=true
autorestart=true
stderr_logfile=/var/log/medtracker-bot.err.log
stdout_logfile=/var/log/medtracker-bot.out.log
environment=BOT_TOKEN="ваш_токен",DATA_FILE="/data/meds_data.json"

[program:medtracker-server]
command=/usr/bin/python3 /path/to/server.py
directory=/path/to/
autostart=true
autorestart=true
stderr_logfile=/var/log/medtracker-server.err.log
stdout_logfile=/var/log/medtracker-server.out.log
environment=PORT="3000",DATA_FILE="/data/meds_data.json"
