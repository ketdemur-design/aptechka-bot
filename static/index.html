<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Моя Аптечка</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
        * { font-family: 'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif; }
        body {
            background: var(--bg);
            color: var(--text-primary);
            transition: background-color 0.3s ease, color 0.3s ease;
            background-image: radial-gradient(circle at 100% 0%, rgba(99,102,241,0.15) 0%, transparent 50%),
                              radial-gradient(circle at 0% 100%, rgba(168,85,247,0.1) 0%, transparent 50%);
            background-attachment: fixed;
        }
        :root {
            --bg: #e2e8f0;
            --surface: #ffffff;
            --surface-hover: #f1f5f9;
            --btn-secondary: #cbd5e1;
            --text-primary: #0f172a;
            --text-secondary: #475569;
        }
        .dark {
            --bg: #090b11;
            --surface: #1a1f2e;
            --surface-hover: #252b3d;
            --btn-secondary: #2d3446;
            --text-primary: #ffffff;
            --text-secondary: #94a3b8;
        }
        .glass {
            background: var(--surface);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.05);
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05), 0 8px 10px -6px rgba(0,0,0,0.05);
        }
        .dark .glass {
            background: linear-gradient(135deg, rgba(30,41,59,0.7) 0%, rgba(15,23,42,0.8) 100%);
            border-color: rgba(255,255,255,0.1);
        }
        .card-shadow { box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05), 0 8px 10px -6px rgba(0,0,0,0.05); }
        .dark .card-shadow { box-shadow: 0 20px 40px -12px rgba(0,0,0,0.5); }
        .progress-bar {
            transition: width 0.8s cubic-bezier(0.2, 0.9, 0.4, 1.1);
        }
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(4px);
            align-items: center;
            justify-content: center;
            z-index: 50;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: var(--surface);
            border-radius: 2rem;
            max-width: 90%;
            width: 400px;
            padding: 1.5rem;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translate(-50%, 20px); }
            to { opacity: 1; transform: translate(-50%, 0); }
        }
        .toast-notification {
            animation: slideUp 0.3s ease-out;
        }
        button {
            cursor: pointer;
        }
    </style>
</head>
<body class="pb-20 px-4 pt-8 max-w-lg mx-auto">
    <header class="flex items-center justify-between mb-10">
        <div>
            <div class="flex items-end gap-2">
                <h1 class="text-3xl font-extrabold tracking-tight bg-gradient-to-r from-[var(--text-primary)] to-[var(--text-secondary)] bg-clip-text text-transparent">
                    Мои лекарства
                </h1>
                <span id="appVersionLabel" class="text-[10px] font-thin text-[var(--text-secondary)] mb-1">V.1</span>
            </div>
            <p class="text-[var(--text-secondary)] text-sm font-medium mt-1">Будьте здоровы и не пропускайте приём</p>
        </div>
        <div class="flex items-center gap-2">
            <button id="themeToggle" class="p-2.5 glass rounded-2xl hover:bg-[var(--surface-hover)] transition-colors group">
                <svg id="themeIcon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
            </button>
            <button id="refreshBtn" class="p-2.5 glass rounded-2xl hover:bg-[var(--surface-hover)] transition-colors group">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
            </button>
        </div>
    </header>

    <div class="grid grid-cols-2 gap-4 mb-8">
        <div class="glass p-5 rounded-[2rem] card-shadow">
            <div class="flex items-center gap-3 mb-2">
                <div class="p-2 bg-emerald-400/10 rounded-xl text-emerald-400">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
                </div>
                <span class="text-[var(--text-secondary)] text-xs font-bold uppercase tracking-wider">Активные</span>
            </div>
            <div id="activeCount" class="text-3xl font-bold text-[var(--text-primary)]">0</div>
        </div>
        <div class="glass p-5 rounded-[2rem] card-shadow">
            <div class="flex items-center gap-3 mb-2">
                <div class="p-2 bg-amber-400/10 rounded-xl text-amber-400">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m21 16-4 4-4-4"/><path d="M17 20V4"/><path d="m3 8 4-4 4 4"/><path d="M7 4v16"/></svg>
                </div>
                <span class="text-[var(--text-secondary)] text-xs font-bold uppercase tracking-wider">Заканчиваются</span>
            </div>
            <div id="expiringCount" class="text-3xl font-bold text-[var(--text-primary)]">0</div>
        </div>
    </div>

    <div id="screenMain">
    <div class="flex items-center justify-between mb-6">
        <h2 class="text-xs font-bold text-[var(--text-secondary)] uppercase tracking-[0.2em] pl-2">Текущий график</h2>
        <button id="addMedBtn" class="bg-violet-600 text-white px-4 py-2 rounded-full text-sm font-bold flex items-center gap-1 shadow-lg hover:bg-violet-700 transition">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
            Добавить
        </button>
    </div>

    <div id="medsList" class="space-y-4"></div>
    </div>

    <!-- Экран: Настройка расписания -->
    <div id="screenSchedule" style="display:none">
        <div class="flex items-center justify-between mb-6">
            <h2 class="text-xs font-bold text-[var(--text-secondary)] uppercase tracking-[0.2em] pl-2">Настройка расписания</h2>
        </div>
        <div id="scheduleList" class="space-y-4"></div>
    </div>

    <!-- Экран: Напоминания -->
    <div id="screenReminders" style="display:none">
        <div class="flex items-center justify-between mb-6">
            <h2 class="text-xs font-bold text-[var(--text-secondary)] uppercase tracking-[0.2em] pl-2">Ближайшие напоминания</h2>
        </div>
        <div id="remindersList" class="space-y-4"></div>
    </div>

    <!-- Модальное окно добавления лекарства -->
    <div id="addModal" class="modal">
        <div class="modal-content">
            <div id="wizardContent"></div>
        </div>
    </div>

    <!-- Floating Action Bar -->
    <div class="fixed bottom-8 left-1/2 -translate-x-1/2 w-full max-w-[calc(512px-32px)] px-4">
        <div class="glass h-16 rounded-full flex items-center justify-around px-8 shadow-2xl border-t border-white/10">
            <button id="bottomCalendar" title="Сводка" class="text-violet-400">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/></svg>
            </button>
            <button id="bottomSchedule" title="Настройка расписания" class="text-[var(--text-secondary)] hover:text-[var(--text-primary)]">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
            </button>
            <button id="bottomReminder" title="Напоминания о приёме" class="text-[var(--text-secondary)] hover:text-[var(--text-primary)]">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            </button>
        </div>
    </div>

    <script>
        // Глобальные переменные
        let medsData = [];
        let addWizardStep = 0;
        const BASE_URL = window.location.origin;
        const DEFAULT_APP_VERSION = "V.1";
        let APP_VERSION = DEFAULT_APP_VERSION;

        function withVersion(url) {
            const separator = url.includes("?") ? "&" : "?";
            return `${url}${separator}v=${encodeURIComponent(APP_VERSION)}`;
        }
        let addWizardData = {};

        const FORM_LABELS = {
            tablets: ["таблетке", "таблеток"],
            capsules: ["капсуле", "капсул"],
            liquid: ["бутылке", "бутылок"],
            drops: ["флаконе", "флаконов"],
            spray: ["флаконе", "флаконов"],
            sachet: ["саше", "саше"]
        };

        // ========== ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ ==========
        function showToast(message, isError = false) {
            const existingToast = document.querySelector('.toast-notification');
            if (existingToast) existingToast.remove();
            
            const toast = document.createElement('div');
            toast.className = `toast-notification fixed bottom-28 left-1/2 -translate-x-1/2 px-5 py-3 rounded-2xl text-white font-bold z-50 ${isError ? 'bg-rose-600' : 'bg-emerald-600'} shadow-2xl`;
            toast.style.whiteSpace = 'nowrap';
            toast.innerText = message;
            document.body.appendChild(toast);
            
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translate(-50%, 20px)';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        // ========== API ВЫЗОВЫ ==========
        async function fetchMeds() {
            try {
                const res = await fetch(`${BASE_URL}/api/meds`);
                if (!res.ok) throw new Error('Network error');
                medsData = await res.json();
                updateStats();
                renderMeds();
            } catch (err) {
                console.error(err);
                const container = document.getElementById('medsList');
                if (container) {
                    container.innerHTML = '<div class="text-center py-10 text-[var(--text-secondary)]">Ошибка загрузки данных</div>';
                }
            }
        }

        async function takeMed(chatId, medName) {
            try {
                const res = await fetch(`${BASE_URL}/api/taken`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: chatId, med_name: medName })
                });
                if (res.ok) {
                    showToast('✅ Приём отмечен!');
                    await fetchMeds();
                }
            } catch (err) { 
                console.error(err);
                showToast('❌ Ошибка', true);
            }
        }

        async function startCourse(chatId, medName) {
            try {
                const res = await fetch(`${BASE_URL}/api/meds/start`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: chatId, med_name: medName })
                });
                if (res.ok) {
                    showToast(`✅ Курс "${medName}" начат!`);
                    await fetchMeds();
                }
            } catch (err) { 
                console.error(err);
                showToast('❌ Ошибка', true);
            }
        }

        async function deleteMed(chatId, medName) {
            if (!confirm(`Удалить "${medName}"?`)) return;
            try {
                const res = await fetch(`${BASE_URL}/api/meds?chat_id=${chatId}&med_name=${encodeURIComponent(medName)}`, {
                    method: 'DELETE'
                });
                if (res.ok) {
                    showToast('🗑 Лекарство удалено');
                    await fetchMeds();
                }
            } catch (err) { 
                console.error(err);
                showToast('❌ Ошибка', true);
            }
        }

        async function updateMed(chatId, medName, field, value) {
            const body = field === 'dose' ? { daily_mg: value } : { add_stock: value };
            try {
                const res = await fetch(`${BASE_URL}/api/meds/update`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: chatId, med_name: medName, ...body })
                });
                if (res.ok) {
                    const result = await res.json();
                    showToast(result.message);
                    await fetchMeds();
                }
            } catch (err) { 
                console.error(err);
                showToast('❌ Ошибка', true);
            }
        }

        // Глобальные функции для кнопок в карточках
        window.handleRefill = function(chatId, medName) {
            let amount = prompt('Введите количество для пополнения (в единицах лекарства):');
            if (amount && !isNaN(parseFloat(amount))) {
                updateMed(chatId, medName, 'refill', parseFloat(amount));
            }
        };
        
        window.handleChangeDose = function(chatId, medName) {
            let dose = prompt('Введите новую суточную дозировку:');
            if (dose && !isNaN(parseFloat(dose))) {
                updateMed(chatId, medName, 'dose', parseFloat(dose));
            }
        };
        
        window.deleteMed = deleteMed;
        window.startCourse = startCourse;
        window.takeMed = takeMed;

        // ========== ОТОБРАЖЕНИЕ ==========
        function updateStats() {
            const active = medsData.filter(m => m.is_started).length;
            const expiring = medsData.filter(m => m.days_left <= 7 && m.days_left > 0).length;
            const activeCount = document.getElementById('activeCount');
            const expiringCount = document.getElementById('expiringCount');
            if (activeCount) activeCount.innerText = active;
            if (expiringCount) expiringCount.innerText = expiring;
        }

        function getFormIcon(form) {
            const icons = { tablets: '💊', capsules: '💊', drops: '💧', spray: '💨', liquid: '🧴', sachet: '📦' };
            return icons[form] || '💊';
        }

        function getFormColor(form) {
            const colors = {
                tablets: 'bg-violet-100 text-violet-600 dark:bg-violet-500/10 dark:text-violet-400',
                capsules: 'bg-purple-100 text-purple-600 dark:bg-purple-500/10 dark:text-purple-400',
                drops: 'bg-emerald-100 text-emerald-600 dark:bg-emerald-500/10 dark:text-emerald-400',
                spray: 'bg-amber-100 text-amber-600 dark:bg-amber-500/10 dark:text-amber-400',
                liquid: 'bg-sky-100 text-sky-600 dark:bg-sky-500/10 dark:text-sky-400',
                sachet: 'bg-rose-100 text-rose-600 dark:bg-rose-500/10 dark:text-rose-400'
            };
            return colors[form] || 'bg-slate-100 text-slate-600 dark:bg-slate-800/50 dark:text-slate-400';
        }

        function renderMeds() {
            const container = document.getElementById('medsList');
            if (!container) return;
            
            if (!medsData.length) {
                container.innerHTML = `<div class="text-center py-20"><div class="bg-[var(--surface-hover)] w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-6"><svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="text-[var(--text-secondary)]/50"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/></svg></div><p class="text-[var(--text-secondary)] font-medium">Лекарства не найдены.<br/>Нажмите «Добавить»</p></div>`;
                return;
            }

            let html = '';
            for (let med of medsData) {
                const progress = med.progress || 0;
                const progressColor = progress >= 80 ? 'from-red-500 via-rose-500 to-rose-600' : (progress >= 50 ? 'from-yellow-400 via-amber-500 to-orange-500' : 'from-green-300 via-green-500 to-emerald-500');
                const icon = getFormIcon(med.form);
                const formColor = getFormColor(med.form);
                const isStarted = med.is_started;
                const daysLeft = med.days_left;
                const remainingDoses = med.remaining_doses || 0;
                const doseLabel = med.dose_label || 'мг';

                html += `<div class="glass rounded-[2.5rem] p-6 relative overflow-hidden group hover:border-white/10 transition-colors">
                    <div class="flex items-start justify-between mb-4">
                        <div class="flex items-center gap-4">
                            <div class="w-14 h-14 rounded-[1.5rem] flex items-center justify-center relative shadow-lg ${formColor}">
                                <div class="relative z-10 text-2xl">${icon}</div>
                            </div>
                            <div>
                                <h3 class="font-bold text-lg text-[var(--text-primary)] uppercase tracking-tight">${escapeHtml(med.name)}</h3>
                                <div class="flex items-center gap-2">
                                    <p class="text-[var(--text-secondary)] text-sm font-medium">${med.dose_line || ''}</p>
                                    <div class="w-1 h-1 rounded-full bg-[var(--text-secondary)]/30"></div>
                                    <p class="text-[var(--text-secondary)] text-[11px] font-bold uppercase tracking-wider">${med.course_days === 0 ? 'Пожизненно' : `Курс: ${med.course_days} дн.`}</p>
                                </div>
                            </div>
                        </div>
                        <div class="flex flex-col items-end gap-2">
                            <button onclick="deleteMed(${med.chat_id}, '${escapeHtml(med.name).replace(/'/g, "\\'")}')" class="p-2 text-rose-500/60 hover:text-rose-500 hover:bg-rose-500/10 rounded-xl transition-all">
                                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 4V3c0-1 1-2 2-2h4c1 0 2 1 2 2v1"/></svg>
                            </button>
                            <div class="px-3 py-1 rounded-full text-[10px] font-bold uppercase tracking-wider ${daysLeft <= 7 ? 'bg-rose-500/10 text-rose-400' : 'bg-emerald-500/10 text-emerald-400'}">${daysLeft} дн. ост.</div>
                            ${isStarted ? '<div class="px-2 py-0.5 rounded-md bg-emerald-500/10 text-emerald-500 text-[9px] font-black uppercase tracking-tighter flex items-center gap-1"><div class="w-1 h-1 rounded-full bg-emerald-500 animate-pulse"></div>КУРС НАЧАТ</div>' : ''}
                        </div>
                    </div>
                    <div class="mb-6">
                        <div class="flex justify-between text-[11px] font-extrabold text-[var(--text-secondary)] uppercase tracking-widest mb-3">
                            <span class="flex items-center gap-1.5 opacity-90"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m21 16-4 4-4-4"/><path d="M17 20V4"/><path d="m3 8 4-4 4 4"/><path d="M7 4v16"/></svg>ЗАПАС</span>
                            <span class="text-sm ${progress >= 80 ? 'text-rose-500 font-black' : (progress >= 50 ? 'text-amber-500 font-black' : 'text-emerald-500 font-black')}">${progress}%</span>
                        </div>
                        <div class="h-6 w-full bg-slate-400/15 dark:bg-black/60 rounded-full overflow-hidden relative p-1 border border-black/[0.03] dark:border-white/5 shadow-inner">
                            <div class="progress-bar h-full rounded-full bg-gradient-to-r ${progressColor} relative flex items-center justify-end pr-0.5" style="width: ${progress}%">
                                <div class="absolute inset-x-0 top-0 h-1/2 bg-white/20 rounded-t-full pointer-events-none"></div>
                                <div class="w-3 h-3 rounded-full bg-white/30 backdrop-blur-md border border-white/40 shadow-sm flex items-center justify-center shrink-0"><div class="w-1 h-1 rounded-full bg-white/90 shadow-sm"></div></div>
                            </div>
                        </div>
                    </div>
                    <div class="flex items-center justify-between mb-6">
                        <div class="flex items-center gap-2 text-[var(--text-secondary)] text-xs font-bold btn-secondary px-4 py-2 rounded-2xl border border-white/10">
                            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="text-violet-400"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                            ${med.schedule || 'не указано'}
                        </div>
                        <div class="flex flex-col items-end gap-1">
                            <div class="text-[11px] font-extrabold uppercase tracking-tight px-3 py-1.5 rounded-xl ${daysLeft <= 3 ? 'bg-rose-500 text-white animate-pulse shadow-[0_0_15px_rgba(244,63,94,0.4)]' : 'text-[var(--text-secondary)] bg-[var(--surface-hover)]'}">Запас: ${remainingDoses} ${doseLabel}</div>
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-3 mb-4">
                        <button onclick="window.handleRefill(${med.chat_id}, '${escapeHtml(med.name).replace(/'/g, "\\'")}')" class="flex items-center justify-center gap-2 py-3 rounded-2xl btn-secondary border border-white/10 text-[var(--text-secondary)] text-sm font-bold hover:text-emerald-500 hover:border-emerald-500/20 transition-all">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>Пополнить
                        </button>
                        <button onclick="window.handleChangeDose(${med.chat_id}, '${escapeHtml(med.name).replace(/'/g, "\\'")}')" class="flex items-center justify-center gap-2 py-3 rounded-2xl btn-secondary border border-white/10 text-[var(--text-secondary)] text-sm font-bold hover:text-violet-500 hover:border-violet-500/20 transition-all">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33-1.82 2 2 0 0 1 0-2.36 1.65 1.65 0 0 0-.33-1.82 1.65 1.65 0 0 0-1.82-.33 2 2 0 0 1-2.36 0 1.65 1.65 0 0 0-1.82.33 2 2 0 0 1-2.36 0 1.65 1.65 0 0 0-1.82-.33 2 2 0 0 1-2.36 0 1.65 1.65 0 0 0-1.82.33 1.65 1.65 0 0 0-.33 1.82 2 2 0 0 1 0 2.36 1.65 1.65 0 0 0 .33 1.82 1.65 1.65 0 0 0 1.82.33 2 2 0 0 1 2.36 0 1.65 1.65 0 0 0 1.82.33 2 2 0 0 1 2.36 0 1.65 1.65 0 0 0 1.82.33 1.65 1.65 0 0 0 .33-1.82z"/></svg>Дозировка
                        </button>
                    </div>
                    ${!isStarted ? `<button onclick="startCourse(${med.chat_id}, '${escapeHtml(med.name).replace(/'/g, "\\'")}')" class="w-full bg-emerald-500 text-white font-extrabold py-4 rounded-3xl flex items-center justify-center gap-2 hover:bg-emerald-600 active:scale-95 transition-all shadow-lg shadow-emerald-500/20"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>Начать курс</button>` : `
                    <button onclick="takeMed(${med.chat_id}, '${escapeHtml(med.name).replace(/'/g, "\\'")}')" class="w-full bg-violet-600 dark:bg-violet-500 text-white font-extrabold py-4 rounded-3xl flex items-center justify-center gap-2 hover:brightness-110 active:scale-95 transition-all shadow-xl"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>Выпил</button>`}
                </div>`;
            }
            container.innerHTML = html;
        }

        // ========== МАСТЕР ДОБАВЛЕНИЯ ==========
        function showAddWizard() {
            addWizardStep = 0;
            addWizardData = {};
            const modal = document.getElementById('addModal');
            if (modal) modal.classList.add('active');
            renderWizardStep();
        }

        function renderWizardStep() {
            const wizardContent = document.getElementById('wizardContent');
            if (!wizardContent) return;

            if (addWizardStep === 0) {
                wizardContent.innerHTML = `
                    <h3 class="text-xl font-bold mb-4 text-[var(--text-primary)]">Новое лекарство</h3>
                    <input type="text" id="wizardName" placeholder="Название лекарства" class="w-full p-3 rounded-xl bg-[var(--surface-hover)] text-[var(--text-primary)] mb-4 border border-white/10">
                    <div class="flex gap-3">
                        <button id="wizardNextBtn" class="flex-1 bg-emerald-600 text-white py-3 rounded-xl font-bold">Далее</button>
                        <button id="wizardCancelBtn" class="flex-1 bg-rose-600 text-white py-3 rounded-xl font-bold">Отмена</button>
                    </div>
                `;
                const nextBtn = document.getElementById('wizardNextBtn');
                const cancelBtn = document.getElementById('wizardCancelBtn');
                if (nextBtn) {
                    nextBtn.onclick = () => {
                        const name = document.getElementById('wizardName').value.trim();
                        if (!name) {
                            showToast('❌ Введите название', true);
                            return;
                        }
                        addWizardData.name = name;
                        addWizardStep = 1;
                        renderWizardStep();
                    };
                }
                if (cancelBtn) {
                    cancelBtn.onclick = () => {
                        document.getElementById('addModal').classList.remove('active');
                    };
                }
            } 
            else if (addWizardStep === 1) {
                wizardContent.innerHTML = `
                    <h3 class="text-xl font-bold mb-4 text-[var(--text-primary)]">Выберите форму</h3>
                    <div class="grid grid-cols-2 gap-3 mb-4">
                        <button data-form="tablets" class="wizard-form-btn p-3 rounded-xl bg-[var(--surface-hover)] text-[var(--text-primary)] font-medium hover:bg-violet-500/20">💊 Таблетки</button>
                        <button data-form="capsules" class="wizard-form-btn p-3 rounded-xl bg-[var(--surface-hover)] text-[var(--text-primary)] font-medium hover:bg-violet-500/20">💊 Капсулы</button>
                        <button data-form="drops" class="wizard-form-btn p-3 rounded-xl bg-[var(--surface-hover)] text-[var(--text-primary)] font-medium hover:bg-violet-500/20">👁 Капли</button>
                        <button data-form="spray" class="wizard-form-btn p-3 rounded-xl bg-[var(--surface-hover)] text-[var(--text-primary)] font-medium hover:bg-violet-500/20">💨 Спрей</button>
                        <button data-form="sachet" class="wizard-form-btn p-3 rounded-xl bg-[var(--surface-hover)] text-[var(--text-primary)] font-medium hover:bg-violet-500/20">📦 Саше</button>
                        <button data-form="liquid" class="wizard-form-btn p-3 rounded-xl bg-[var(--surface-hover)] text-[var(--text-primary)] font-medium hover:bg-violet-500/20">🧴 Жидкость</button>
                    </div>
                    <button id="wizardBackBtn" class="w-full p-3 rounded-xl bg-[var(--btn-secondary)] text-[var(--text-primary)] font-bold">Назад</button>
                `;
                document.querySelectorAll('.wizard-form-btn').forEach(btn => {
                    btn.onclick = () => {
                        addWizardData.form = btn.dataset.form;
                        addWizardStep = 2;
                        renderWizardStep();
                    };
                });
                const backBtn = document.getElementById('wizardBackBtn');
                if (backBtn) {
                    backBtn.onclick = () => {
                        addWizardStep = 0;
                        renderWizardStep();
                    };
                }
            }
            else if (addWizardStep === 2) {
                const form = addWizardData.form;
                const label = FORM_LABELS[form] || ["единице", "единиц"];
                let question = form === "drops" ? "Объем флакона (мл)?" :
                              form === "spray" ? "Сколько мл в одном флаконе?" :
                              form === "liquid" ? "Сколько мл в одной единице?" :
                              `Сколько мг в одной ${label[0]}?`;
                
                wizardContent.innerHTML = `
                    <h3 class="text-xl font-bold mb-4 text-[var(--text-primary)]">${question}</h3>
                    <input type="number" step="any" id="wizardUnitMg" class="w-full p-3 rounded-xl bg-[var(--surface-hover)] text-[var(--text-primary)] mb-4 border border-white/10">
                    <div class="flex gap-3">
                        <button id="wizardNextBtn" class="flex-1 bg-emerald-600 text-white py-3 rounded-xl font-bold">Далее</button>
                        <button id="wizardBackBtn" class="flex-1 bg-[var(--btn-secondary)] text-[var(--text-primary)] py-3 rounded-xl font-bold">Назад</button>
                    </div>
                `;
                const nextBtn = document.getElementById('wizardNextBtn');
                const backBtn = document.getElementById('wizardBackBtn');
                if (nextBtn) {
                    nextBtn.onclick = () => {
                        const val = parseFloat(document.getElementById('wizardUnitMg').value);
                        if (isNaN(val) || val <= 0) {
                            showToast('❌ Введите корректное значение', true);
                            return;
                        }
                        addWizardData.unit_mg = val;
                        addWizardStep = 3;
                        renderWizardStep();
                    };
                }
                if (backBtn) {
                    backBtn.onclick = () => {
                        addWizardStep = 1;
                        renderWizardStep();
                    };
                }
            }
            else if (addWizardStep === 3) {
                const plural = FORM_LABELS[addWizardData.form]?.[1] || "единиц";
                wizardContent.innerHTML = `
                    <h3 class="text-xl font-bold mb-4 text-[var(--text-primary)]">Сколько ${plural} купили?</h3>
                    <input type="number" step="any" id="wizardUnits" class="w-full p-3 rounded-xl bg-[var(--surface-hover)] text-[var(--text-primary)] mb-4 border border-white/10">
                    <div class="flex gap-3">
                        <button id="wizardNextBtn" class="flex-1 bg-emerald-600 text-white py-3 rounded-xl font-bold">Далее</button>
                        <button id="wizardBackBtn" class="flex-1 bg-[var(--btn-secondary)] text-[var(--text-primary)] py-3 rounded-xl font-bold">Назад</button>
                    </div>
                `;
                const nextBtn = document.getElementById('wizardNextBtn');
                const backBtn = document.getElementById('wizardBackBtn');
                if (nextBtn) {
                    nextBtn.onclick = () => {
                        const val = parseFloat(document.getElementById('wizardUnits').value);
                        if (isNaN(val) || val <= 0) {
                            showToast('❌ Введите корректное количество', true);
                            return;
                        }
                        addWizardData.units = val;
                        addWizardStep = 4;
                        renderWizardStep();
                    };
                }
                if (backBtn) {
                    backBtn.onclick = () => {
                        addWizardStep = 2;
                        renderWizardStep();
                    };
                }
            }
            else if (addWizardStep === 4) {
                let doseUnit = addWizardData.form === "drops" ? "капель" :
                              addWizardData.form === "spray" ? "впрыскиваний" :
                              addWizardData.form === "liquid" ? "мл" : "мг";
                
                wizardContent.innerHTML = `
                    <h3 class="text-xl font-bold mb-4 text-[var(--text-primary)]">Сколько ${doseUnit} в сутки принимаете?</h3>
                    <input type="number" step="any" id="wizardDailyMg" class="w-full p-3 rounded-xl bg-[var(--surface-hover)] text-[var(--text-primary)] mb-4 border border-white/10">
                    <div class="flex gap-3">
                        <button id="wizardNextBtn" class="flex-1 bg-emerald-600 text-white py-3 rounded-xl font-bold">Далее</button>
                        <button id="wizardBackBtn" class="flex-1 bg-[var(--btn-secondary)] text-[var(--text-primary)] py-3 rounded-xl font-bold">Назад</button>
                    </div>
                `;
                const nextBtn = document.getElementById('wizardNextBtn');
                const backBtn = document.getElementById('wizardBackBtn');
                if (nextBtn) {
                    nextBtn.onclick = () => {
                        const val = parseFloat(document.getElementById('wizardDailyMg').value);
                        if (isNaN(val) || val <= 0) {
                            showToast('❌ Введите корректную дозировку', true);
                            return;
                        }
                        addWizardData.daily_mg = val;
                        addWizardStep = 5;
                        renderWizardStep();
                    };
                }
                if (backBtn) {
                    backBtn.onclick = () => {
                        addWizardStep = 3;
                        renderWizardStep();
                    };
                }
            }
            else if (addWizardStep === 5) {
                wizardContent.innerHTML = `
                    <h3 class="text-xl font-bold mb-4 text-[var(--text-primary)]">Срок приёма</h3>
                    <div class="grid grid-cols-1 gap-3 mb-4">
                        <button id="courseDaysBtn" class="p-3 rounded-xl bg-[var(--surface-hover)] text-[var(--text-primary)] font-medium hover:bg-emerald-500/20">📆 Количество дней</button>
                        <button id="courseMonthsBtn" class="p-3 rounded-xl bg-[var(--surface-hover)] text-[var(--text-primary)] font-medium hover:bg-emerald-500/20">🗓 Количество месяцев</button>
                        <button id="courseForeverBtn" class="p-3 rounded-xl bg-[var(--surface-hover)] text-[var(--text-primary)] font-medium hover:bg-emerald-500/20">♾ Пожизненно</button>
                    </div>
                    <button id="wizardBackBtn" class="w-full p-3 rounded-xl bg-[var(--btn-secondary)] text-[var(--text-primary)] font-bold">Назад</button>
                `;
                
                const daysBtn = document.getElementById('courseDaysBtn');
                const monthsBtn = document.getElementById('courseMonthsBtn');
                const foreverBtn = document.getElementById('courseForeverBtn');
                const backBtn = document.getElementById('wizardBackBtn');
                
                if (daysBtn) {
                    daysBtn.onclick = () => showCourseInput('days');
                }
                if (monthsBtn) {
                    monthsBtn.onclick = () => showCourseInput('months');
                }
                if (foreverBtn) {
                    foreverBtn.onclick = () => {
                        addWizardData.course_days = 0;
                        finishAddWizard();
                    };
                }
                if (backBtn) {
                    backBtn.onclick = () => {
                        addWizardStep = 4;
                        renderWizardStep();
                    };
                }
                
                function showCourseInput(type) {
                    const unit = type === 'months' ? 'месяцев' : 'дней';
                    wizardContent.innerHTML = `
                        <h3 class="text-xl font-bold mb-4 text-[var(--text-primary)]">Введите количество ${unit}</h3>
                        <input type="number" id="wizardCourseValue" class="w-full p-3 rounded-xl bg-[var(--surface-hover)] text-[var(--text-primary)] mb-4 border border-white/10">
                        <div class="flex gap-3">
                            <button id="courseConfirmBtn" class="flex-1 bg-emerald-600 text-white py-3 rounded-xl font-bold">Сохранить</button>
                            <button id="courseBackBtn" class="flex-1 bg-[var(--btn-secondary)] text-[var(--text-primary)] py-3 rounded-xl font-bold">Назад</button>
                        </div>
                    `;
                    const confirmBtn = document.getElementById('courseConfirmBtn');
                    const backBtn2 = document.getElementById('courseBackBtn');
                    if (confirmBtn) {
                        confirmBtn.onclick = () => {
                            let val = parseInt(document.getElementById('wizardCourseValue').value);
                            if (isNaN(val) || val <= 0) {
                                showToast('❌ Введите корректное количество', true);
                                return;
                            }
                            if (type === 'months') val *= 30;
                            addWizardData.course_days = val;
                            finishAddWizard();
                        };
                    }
                    if (backBtn2) {
                        backBtn2.onclick = () => {
                            addWizardStep = 5;
                            renderWizardStep();
                        };
                    }
                }
            }
        }

        async function finishAddWizard() {
            try {
                const payload = {
                    name: addWizardData.name,
                    form: addWizardData.form,
                    unit_mg: addWizardData.unit_mg,
                    units: addWizardData.units,
                    daily_mg: addWizardData.daily_mg,
                    course_days: addWizardData.course_days || 0
                };

                let res;
                try {
                    res = await fetch(withVersion(`${BASE_URL}/api/meds/add`), {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                } catch (primaryErr) {
                    console.warn('Primary add endpoint failed, retrying relative URL', primaryErr);
                    res = await fetch(withVersion('/api/meds/add'), {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                }
                
                if (res.ok) {
                    showToast('✅ Лекарство успешно добавлено!');
                    const modal = document.getElementById('addModal');
                    if (modal) modal.classList.remove('active');
                    await fetchMeds();
                } else {
                    let detail = 'неизвестная';
                    try {
                        const err = await res.json();
                        detail = err.detail || detail;
                    } catch (_) {
                        detail = await res.text() || detail;
                    }
                    showToast('❌ Ошибка: ' + detail, true);
                }
            } catch (err) {
                console.error(err);
                showToast(`❌ Ошибка соединения с сервером (v${APP_VERSION})`, true);
            }
        }

        // ========== ИНИЦИАЛИЗАЦИЯ ==========
        function initTheme() {
            const saved = localStorage.getItem('theme');
            const isDark = saved === 'dark' || (saved === null && window.matchMedia('(prefers-color-scheme: dark)').matches);
            if (isDark) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        }
        
        function toggleTheme() {
            document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
        }

        // Назначение обработчиков событий
        const themeToggleBtn = document.getElementById('themeToggle');
        if (themeToggleBtn) themeToggleBtn.addEventListener('click', toggleTheme);
        
        const refreshBtnElem = document.getElementById('refreshBtn');
        if (refreshBtnElem) refreshBtnElem.addEventListener('click', fetchMeds);
        
        const addMedBtnElem = document.getElementById('addMedBtn');
        if (addMedBtnElem) addMedBtnElem.addEventListener('click', showAddWizard);
        
        // ========== НАВИГАЦИЯ МЕЖДУ ЭКРАНАМИ ==========
        const SCREENS = ['screenMain', 'screenSchedule', 'screenReminders'];
        
        function showScreen(id) {
            SCREENS.forEach(s => {
                const el = document.getElementById(s);
                if (el) el.style.display = 'none';
            });
            const target = document.getElementById(id);
            if (target) target.style.display = 'block';

            // Обновить активную иконку
            document.getElementById('bottomCalendar').classList.toggle('text-violet-400', id === 'screenMain');
            document.getElementById('bottomCalendar').classList.toggle('text-[var(--text-secondary)]', id !== 'screenMain');
            document.getElementById('bottomSchedule').classList.toggle('text-violet-400', id === 'screenSchedule');
            document.getElementById('bottomSchedule').classList.toggle('text-[var(--text-secondary)]', id !== 'screenSchedule');
            document.getElementById('bottomReminder').classList.toggle('text-violet-400', id === 'screenReminders');
            document.getElementById('bottomReminder').classList.toggle('text-[var(--text-secondary)]', id !== 'screenReminders');

            if (id === 'screenSchedule') renderScheduleScreen();
            if (id === 'screenReminders') renderRemindersScreen();
        }

        function renderScheduleScreen() {
            const container = document.getElementById('scheduleList');
            if (!container) return;
            if (!medsData.length) {
                container.innerHTML = '<div class="text-center py-10 text-[var(--text-secondary)]">Нет лекарств в базе</div>';
                return;
            }
            let html = '';
            for (const med of medsData) {
                const icon = getFormIcon(med.form);
                const formColor = getFormColor(med.form);
                const schedule = med.schedule || 'не указано';
                html += `<div class="glass rounded-[2rem] p-5">
                    <div class="flex items-center gap-4 mb-3">
                        <div class="w-12 h-12 rounded-[1.2rem] flex items-center justify-center text-xl ${formColor}">${icon}</div>
                        <div>
                            <div class="font-bold text-[var(--text-primary)] uppercase tracking-tight">${escapeHtml(med.name)}</div>
                            <div class="text-xs text-[var(--text-secondary)] font-medium">${med.dose_line || ''}</div>
                        </div>
                    </div>
                    <div class="flex items-center gap-2 text-sm text-[var(--text-secondary)] bg-[var(--surface-hover)] px-4 py-2 rounded-xl">
                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="text-violet-400 shrink-0"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                        <span>${escapeHtml(schedule)}</span>
                    </div>
                </div>`;
            }
            container.innerHTML = html;
        }

        function renderRemindersScreen() {
            const container = document.getElementById('remindersList');
            if (!container) return;
            if (!medsData.length) {
                container.innerHTML = '<div class="text-center py-10 text-[var(--text-secondary)]">Нет лекарств в базе</div>';
                return;
            }

            const started = medsData.filter(m => m.is_started);
            if (!started.length) {
                container.innerHTML = '<div class="text-center py-10 text-[var(--text-secondary)]">Нет активных курсов. Начните курс, чтобы получать напоминания.</div>';
                return;
            }

            let html = '';
            for (const med of started) {
                const icon = getFormIcon(med.form);
                const formColor = getFormColor(med.form);
                const daysLeft = med.days_left;
                const urgencyClass = daysLeft <= 3 ? 'bg-rose-500/10 text-rose-400' : daysLeft <= 7 ? 'bg-amber-500/10 text-amber-400' : 'bg-emerald-500/10 text-emerald-400';
                html += `<div class="glass rounded-[2rem] p-5">
                    <div class="flex items-center gap-4 mb-3">
                        <div class="w-12 h-12 rounded-[1.2rem] flex items-center justify-center text-xl ${formColor}">${icon}</div>
                        <div class="flex-1">
                            <div class="font-bold text-[var(--text-primary)] uppercase tracking-tight">${escapeHtml(med.name)}</div>
                            <div class="text-xs text-[var(--text-secondary)] font-medium">${med.dose_line || ''}</div>
                        </div>
                        <div class="px-3 py-1 rounded-full text-xs font-bold ${urgencyClass}">${daysLeft} дн.</div>
                    </div>
                    <div class="flex items-center gap-2 text-sm text-[var(--text-secondary)] bg-[var(--surface-hover)] px-4 py-2 rounded-xl mb-3">
                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="text-violet-400 shrink-0"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                        <span>${escapeHtml(med.schedule || 'расписание не задано')}</span>
                    </div>
                    <button onclick="takeMed(${med.chat_id}, '${escapeHtml(med.name).replace(/'/g, "\\'")}'); renderRemindersScreen();" 
                        class="w-full bg-violet-600 text-white font-bold py-3 rounded-2xl flex items-center justify-center gap-2 hover:brightness-110 active:scale-95 transition-all text-sm">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
                        Отметить приём
                    </button>
                </div>`;
            }
            container.innerHTML = html;
        }

        const bottomCalendar = document.getElementById('bottomCalendar');
        if (bottomCalendar) bottomCalendar.addEventListener('click', () => showScreen('screenMain'));
        
        const bottomSchedule = document.getElementById('bottomSchedule');
        if (bottomSchedule) bottomSchedule.addEventListener('click', () => showScreen('screenSchedule'));
        
        const bottomReminder = document.getElementById('bottomReminder');
        if (bottomReminder) bottomReminder.addEventListener('click', () => showScreen('screenReminders'));
        
        const modal = document.getElementById('addModal');
        if (modal) {
            modal.addEventListener('click', (e) => {
                if (e.target === modal) {
                    modal.classList.remove('active');
                }
            });
        }
        
        async function syncAppVersion() {
            try {
                const res = await fetch(`${BASE_URL}/api/version`);
                if (!res.ok) return;
                const data = await res.json();
                if (data?.version) {
                    APP_VERSION = String(data.version);
                    const versionEl = document.getElementById('appVersionLabel');
                    if (versionEl) versionEl.textContent = APP_VERSION;
                }
            } catch (err) {
                console.warn('Failed to sync app version', err);
            }
        }

        initTheme();
        syncAppVersion();
        fetchMeds();
        setInterval(fetchMeds, 30000);
    </script>
</body>
</html>
