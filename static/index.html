<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Моя Аптечка</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Все стили из предыдущей версии (оставьте без изменений) */
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
        * { font-family: 'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif; }
        body {
            background: var(--bg);
            color: var(--text-primary);
            transition: background-color 0.3s ease, color 0.3s ease;
            background-image: radial-gradient(circle at 100% 0%, rgba(99,102,241,0.15) 0%, transparent 50%),
                              radial-gradient(circle at 0% 100%, rgba(168,85,247,0.1) 0%, transparent 50%);
            background-attachment: fixed;
        }
        :root {
            --bg: #e2e8f0;
            --surface: #ffffff;
            --surface-hover: #f1f5f9;
            --btn-secondary: #cbd5e1;
            --text-primary: #0f172a;
            --text-secondary: #475569;
        }
        .dark {
            --bg: #090b11;
            --surface: #1a1f2e;
            --surface-hover: #252b3d;
            --btn-secondary: #2d3446;
            --text-primary: #ffffff;
            --text-secondary: #94a3b8;
        }
        .glass {
            background: var(--surface);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.05);
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05), 0 8px 10px -6px rgba(0,0,0,0.05);
        }
        .dark .glass {
            background: linear-gradient(135deg, rgba(30,41,59,0.7) 0%, rgba(15,23,42,0.8) 100%);
            border-color: rgba(255,255,255,0.1);
        }
        .card-shadow { box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05), 0 8px 10px -6px rgba(0,0,0,0.05); }
        .dark .card-shadow { box-shadow: 0 20px 40px -12px rgba(0,0,0,0.5); }
        .shimmer {
            background: linear-gradient(90deg, transparent, rgba(139,92,246,0.05), transparent);
            background-size: 200% 100%;
            animation: shimmer 2s infinite;
        }
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
        .progress-bar {
            transition: width 0.8s cubic-bezier(0.2, 0.9, 0.4, 1.1);
        }
        .btn-secondary { background-color: var(--btn-secondary); }
        /* Модальное окно */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(4px);
            align-items: center;
            justify-content: center;
            z-index: 50;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: var(--surface);
            border-radius: 2rem;
            max-width: 90%;
            width: 400px;
            padding: 1.5rem;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
        }
    </style>
</head>
<body class="pb-20 px-4 pt-8 max-w-lg mx-auto">
    <header class="flex items-center justify-between mb-10">
        <div>
            <h1 class="text-3xl font-extrabold tracking-tight bg-gradient-to-r from-[var(--text-primary)] to-[var(--text-secondary)] bg-clip-text text-transparent">
                Мои лекарства
            </h1>
            <p class="text-[var(--text-secondary)] text-sm font-medium mt-1">Будьте здоровы и не пропускайте приём</p>
        </div>
        <div class="flex items-center gap-2">
            <button id="themeToggle" class="p-2.5 glass rounded-2xl hover:bg-[var(--surface-hover)] transition-colors group">
                <svg id="themeIcon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
            </button>
            <button id="refreshBtn" class="p-2.5 glass rounded-2xl hover:bg-[var(--surface-hover)] transition-colors group">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
            </button>
        </div>
    </header>

    <div class="grid grid-cols-2 gap-4 mb-8">
        <div class="glass p-5 rounded-[2rem] card-shadow">
            <div class="flex items-center gap-3 mb-2">
                <div class="p-2 bg-emerald-400/10 rounded-xl text-emerald-400">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
                </div>
                <span class="text-[var(--text-secondary)] text-xs font-bold uppercase tracking-wider">Активные</span>
            </div>
            <div id="activeCount" class="text-3xl font-bold text-[var(--text-primary)]">0</div>
        </div>
        <div class="glass p-5 rounded-[2rem] card-shadow">
            <div class="flex items-center gap-3 mb-2">
                <div class="p-2 bg-amber-400/10 rounded-xl text-amber-400">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m21 16-4 4-4-4"/><path d="M17 20V4"/><path d="m3 8 4-4 4 4"/><path d="M7 4v16"/></svg>
                </div>
                <span class="text-[var(--text-secondary)] text-xs font-bold uppercase tracking-wider">Заканчиваются</span>
            </div>
            <div id="expiringCount" class="text-3xl font-bold text-[var(--text-primary)]">0</div>
        </div>
    </div>

    <div class="flex items-center justify-between mb-6">
        <h2 class="text-xs font-bold text-[var(--text-secondary)] uppercase tracking-[0.2em] pl-2">Текущий график</h2>
        <button id="addMedBtn" class="bg-violet-600 text-white px-4 py-2 rounded-full text-sm font-bold flex items-center gap-1 shadow-lg hover:bg-violet-700 transition">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
            Добавить
        </button>
    </div>

    <div id="medsList" class="space-y-4"></div>

    <!-- Модальное окно добавления лекарства -->
    <div id="addModal" class="modal">
        <div class="modal-content">
            <h3 class="text-xl font-bold mb-4 text-[var(--text-primary)]">Новое лекарство</h3>
            <form id="addMedForm">
                <input type="text" id="medName" placeholder="Название" class="w-full p-3 rounded-xl bg-[var(--surface-hover)] text-[var(--text-primary)] mb-3 border border-white/10" required>
                <select id="medForm" class="w-full p-3 rounded-xl bg-[var(--surface-hover)] text-[var(--text-primary)] mb-3 border border-white/10">
                    <option value="tablets">Таблетки</option>
                    <option value="capsules">Капсулы</option>
                    <option value="drops">Капли</option>
                    <option value="spray">Спрей</option>
                    <option value="liquid">Жидкость</option>
                    <option value="sachet">Саше</option>
                </select>
                <input type="number" step="any" id="medUnitMg" placeholder="Мг в одной единице (или мл)" class="w-full p-3 rounded-xl bg-[var(--surface-hover)] text-[var(--text-primary)] mb-3 border border-white/10" required>
                <input type="number" id="medUnits" placeholder="Количество единиц" class="w-full p-3 rounded-xl bg-[var(--surface-hover)] text-[var(--text-primary)] mb-3 border border-white/10" required>
                <input type="number" step="any" id="medDailyMg" placeholder="Суточная дозировка (мг/капли/мл)" class="w-full p-3 rounded-xl bg-[var(--surface-hover)] text-[var(--text-primary)] mb-3 border border-white/10" required>
                <input type="number" id="medCourseDays" placeholder="Длительность курса (дней, 0 = пожизненно)" class="w-full p-3 rounded-xl bg-[var(--surface-hover)] text-[var(--text-primary)] mb-4 border border-white/10">
                <div class="flex gap-3">
                    <button type="submit" class="flex-1 bg-emerald-600 text-white py-3 rounded-xl font-bold">Сохранить</button>
                    <button type="button" id="closeModalBtn" class="flex-1 bg-rose-600 text-white py-3 rounded-xl font-bold">Отмена</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Floating Action Bar (декоративная) -->
    <div class="fixed bottom-8 left-1/2 -translate-x-1/2 w-full max-w-[calc(512px-32px)] px-4">
        <div class="glass h-16 rounded-full flex items-center justify-around px-8 shadow-2xl border-t border-white/10">
            <button class="text-violet-400"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/></svg></button>
            <button class="text-[var(--text-secondary)] hover:text-[var(--text-primary)]"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></button>
            <button class="text-[var(--text-secondary)] hover:text-[var(--text-primary)]"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></button>
        </div>
    </div>

    <script>
        let medsData = [];
        let activeReminderName = null;

        const medsContainer = document.getElementById('medsList');
        const activeCountSpan = document.getElementById('activeCount');
        const expiringCountSpan = document.getElementById('expiringCount');
        const refreshBtn = document.getElementById('refreshBtn');
        const themeToggle = document.getElementById('themeToggle');
        const addMedBtn = document.getElementById('addMedBtn');
        const addModal = document.getElementById('addModal');
        const closeModalBtn = document.getElementById('closeModalBtn');
        const addMedForm = document.getElementById('addMedForm');

        function initTheme() {
            const saved = localStorage.getItem('theme');
            const isDark = saved === 'dark' || (saved === null && window.matchMedia('(prefers-color-scheme: dark)').matches);
            if (isDark) document.documentElement.classList.add('dark');
            else document.documentElement.classList.remove('dark');
            updateThemeIcon();
        }
        function toggleTheme() {
            document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
            updateThemeIcon();
        }
        function updateThemeIcon() {
            const isDark = document.documentElement.classList.contains('dark');
            const icon = document.getElementById('themeIcon');
            if (isDark) {
                icon.outerHTML = `<svg id="themeIcon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="text-[var(--text-primary)] group-hover:text-amber-400"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>`;
            } else {
                icon.outerHTML = `<svg id="themeIcon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="text-[var(--text-primary)] group-hover:text-amber-400"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>`;
            }
        }
        themeToggle.addEventListener('click', toggleTheme);

        // API вызовы
        async function fetchMeds() {
            try {
                const res = await fetch('/api/meds', { cache: 'no-store' });
                if (!res.ok) throw new Error('Network error');
                medsData = await res.json();
                updateStats();
                renderMeds();
            } catch (err) {
                console.error(err);
                medsContainer.innerHTML = '<div class="text-center py-10 text-[var(--text-secondary)]">Ошибка загрузки данных</div>';
            }
        }

        async function takeMed(chatId, medName) {
            try {
                const res = await fetch('/api/taken', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: chatId, med_name: medName })
                });
                if (res.ok) await fetchMeds();
                else alert('Не удалось отметить приём');
            } catch (err) { console.error(err); }
        }

        async function startCourse(chatId, medName) {
            try {
                const res = await fetch('/api/meds/start', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: chatId, med_name: medName })
                });
                if (res.ok) await fetchMeds();
                else alert('Ошибка старта курса');
            } catch (err) { console.error(err); }
        }

        async function deleteMed(chatId, medName) {
            if (!confirm('Удалить это лекарство?')) return;
            try {
                const res = await fetch('/api/meds', {
                    method: 'DELETE',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: chatId, med_name: medName })
                });
                if (res.ok) await fetchMeds();
                else alert('Ошибка удаления');
            } catch (err) { console.error(err); }
        }

        async function updateMed(chatId, medName, field, value) {
            const body = field === 'dose' ? { daily_mg: value } : { add_stock: value };
            try {
                const res = await fetch('/api/meds/update', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: chatId, med_name: medName, ...body })
                });
                if (res.ok) await fetchMeds();
                else alert('Ошибка обновления');
            } catch (err) { console.error(err); }
        }

        // Добавление лекарства через веб
        async function addMedicine(medData) {
            try {
                const res = await fetch('/api/meds/add', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(medData)
                });
                if (res.ok) {
                    await fetchMeds();
                    addModal.classList.remove('active');
                    addMedForm.reset();
                } else {
                    const err = await res.json();
                    alert('Ошибка: ' + (err.error || 'неизвестная'));
                }
            } catch (err) {
                console.error(err);
                alert('Ошибка соединения');
            }
        }

        addMedBtn.addEventListener('click', () => addModal.classList.add('active'));
        closeModalBtn.addEventListener('click', () => addModal.classList.remove('active'));
        addModal.addEventListener('click', (e) => { if (e.target === addModal) addModal.classList.remove('active'); });
        addMedForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const name = document.getElementById('medName').value.trim();
            if (!name) return;
            const form = document.getElementById('medForm').value;
            const unit_mg = parseFloat(document.getElementById('medUnitMg').value);
            const units = parseInt(document.getElementById('medUnits').value);
            const daily_mg = parseFloat(document.getElementById('medDailyMg').value);
            let course_days = parseInt(document.getElementById('medCourseDays').value);
            if (isNaN(course_days)) course_days = 0;
            if (isNaN(unit_mg) || isNaN(units) || isNaN(daily_mg)) {
                alert('Заполните все поля числами');
                return;
            }
            addMedicine({ name, form, unit_mg, units, daily_mg, course_days });
        });

        function updateStats() {
            const active = medsData.filter(m => m.is_started).length;
            const expiring = medsData.filter(m => m.days_left <= 7 && m.days_left > 0).length;
            activeCountSpan.innerText = active;
            expiringCountSpan.innerText = expiring;
        }

        function getFormIcon(form) {
            const icons = { tablets: '💊', capsules: '💊', drops: '💧', spray: '💨', liquid: '🧴', sachet: '📦' };
            return icons[form] || '💊';
        }

        function getFormColor(form) {
            const colors = {
                tablets: 'bg-violet-100 text-violet-600 dark:bg-violet-500/10 dark:text-violet-400',
                capsules: 'bg-purple-100 text-purple-600 dark:bg-purple-500/10 dark:text-purple-400',
                drops: 'bg-emerald-100 text-emerald-600 dark:bg-emerald-500/10 dark:text-emerald-400',
                spray: 'bg-amber-100 text-amber-600 dark:bg-amber-500/10 dark:text-amber-400',
                liquid: 'bg-sky-100 text-sky-600 dark:bg-sky-500/10 dark:text-sky-400',
                sachet: 'bg-rose-100 text-rose-600 dark:bg-rose-500/10 dark:text-rose-400'
            };
            return colors[form] || 'bg-slate-100 text-slate-600 dark:bg-slate-800/50 dark:text-slate-400';
        }

        function renderMeds() {
            if (!medsContainer) return;
            if (medsData.length === 0) {
                medsContainer.innerHTML = `<div class="text-center py-20"><div class="bg-[var(--surface-hover)] w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-6"><svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="text-[var(--text-secondary)]/50"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/></svg></div><p class="text-[var(--text-secondary)] font-medium">Лекарства не найдены.<br/>Добавьте их через бот или кнопку «Добавить».</p></div>`;
                return;
            }

            let html = '';
            for (let med of medsData) {
                const progress = med.progress || 0;
                const progressColor = progress >= 80 ? 'from-red-500 via-rose-500 to-rose-600' : (progress >= 50 ? 'from-yellow-400 via-amber-500 to-orange-500' : 'from-green-300 via-green-500 to-emerald-500');
                const icon = getFormIcon(med.form);
                const formColor = getFormColor(med.form);
                const isStarted = med.is_started;
                const daysLeft = med.days_left;
                const remainingDoses = med.remaining_doses?.toFixed(0) || 0;
                const doseLabel = med.dose_label || 'мг';

                html += `<div class="glass rounded-[2.5rem] p-6 relative overflow-hidden group hover:border-white/10 transition-colors">
                    <div class="flex items-start justify-between mb-4">
                        <div class="flex items-center gap-4">
                            <div class="w-14 h-14 rounded-[1.5rem] flex items-center justify-center relative shadow-lg ${formColor} transition-all duration-300">
                                <div class="absolute inset-0 bg-white/10 dark:bg-transparent rounded-[1.5rem] pointer-events-none" style="background: linear-gradient(135deg, rgba(255,255,255,0.4) 0%, rgba(255,255,255,0) 50%, rgba(0,0,0,0.1) 100%);"></div>
                                <div class="relative z-10 text-2xl drop-shadow-[0_2px_4px_rgba(0,0,0,0.15)] dark:drop-shadow-none">${icon}</div>
                            </div>
                            <div>
                                <h3 class="font-bold text-lg text-[var(--text-primary)] group-hover:text-violet-500 transition-colors uppercase tracking-tight">${escapeHtml(med.name)}</h3>
                                <div class="flex items-center gap-2">
                                    <p class="text-[var(--text-secondary)] text-sm font-medium">${med.dose_line || ''}</p>
                                    <div class="w-1 h-1 rounded-full bg-[var(--text-secondary)]/30"></div>
                                    <p class="text-[var(--text-secondary)] text-[11px] font-bold uppercase tracking-wider">${med.course_days === 0 ? 'Пожизненно' : `Курс: ${med.course_days} дн.`}</p>
                                </div>
                            </div>
                        </div>
                        <div class="flex flex-col items-end gap-2">
                            <button onclick="deleteMed('${med.chat_id}', '${escapeHtml(med.name).replace(/'/g, "\\'")}')" class="p-2 text-rose-500/60 hover:text-rose-500 hover:bg-rose-500/10 rounded-xl transition-all">
                                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 4V3c0-1 1-2 2-2h4c1 0 2 1 2 2v1"/></svg>
                            </button>
                            <div class="flex flex-col items-end gap-1">
                                <div class="px-3 py-1 rounded-full text-[10px] font-bold uppercase tracking-wider ${daysLeft <= 7 ? 'bg-rose-500/10 text-rose-400' : 'bg-emerald-500/10 text-emerald-400'}">${daysLeft} дн. ост.</div>
                                ${isStarted ? '<div class="px-2 py-0.5 rounded-md bg-emerald-500/10 text-emerald-500 text-[9px] font-black uppercase tracking-tighter flex items-center gap-1"><div class="w-1 h-1 rounded-full bg-emerald-500 animate-pulse"></div>КУРС НАЧАТ</div>' : ''}
                            </div>
                        </div>
                    </div>
                    <div class="mb-6">
                        <div class="flex justify-between text-[11px] font-extrabold text-[var(--text-secondary)] uppercase tracking-widest mb-3">
                            <span class="flex items-center gap-1.5 opacity-90"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m21 16-4 4-4-4"/><path d="M17 20V4"/><path d="m3 8 4-4 4 4"/><path d="M7 4v16"/></svg>${med.course_days === 0 ? 'ЗАПАС ЛЕКАРСТВА' : 'ПРОГРЕСС КУРСА'}</span>
                            <span class="text-sm ${progress >= 80 ? 'text-rose-500 font-black' : (progress >= 50 ? 'text-amber-500 font-black' : 'text-emerald-500 font-black')}">${progress}%</span>
                        </div>
                        <div class="h-6 w-full bg-slate-400/15 dark:bg-black/60 rounded-full overflow-hidden relative p-1 border border-black/[0.03] dark:border-white/5 shadow-inner transition-all">
                            <div class="progress-bar h-full rounded-full bg-gradient-to-r ${progressColor} relative flex items-center justify-end pr-0.5" style="width: ${progress}%">

            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });

            const panelId = `reminder-${medName.replace(/[^a-zA-Z0-9]/g, '_')}`;

        };

            showAddStep();

async function finishAddWizard() {
    const medData = {
        name: addWizardData.name,
        form: addWizardData.form,
        unit_mg: addWizardData.unit_mg,
        units: addWizardData.units,
        daily_mg: addWizardData.daily_mg,
        course_days: addWizardData.course_days || 0
    };
    
    try {
        const res = await fetch('/api/meds/add', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(medData)
        });
        
        if (res.ok) {
            showToast('✅ Лекарство успешно добавлено!');
            await fetchMeds();
            resetAddWizard();
        } else {
            const err = await res.json();
            showToast('❌ Ошибка: ' + (err.error || 'неизвестная'));
        }
    } catch (err) {
        console.error(err);
        showToast('❌ Ошибка соединения');
    }
}

// ================== TOAST УВЕДОМЛЕНИЯ ==================
function showToast(message, isError = false) {
    const existingToast = document.querySelector('.toast-notification');
    if (existingToast) existingToast.remove();
    
    const toast = document.createElement('div');
    toast.className = `toast-notification fixed bottom-28 left-1/2 -translate-x-1/2 px-5 py-3 rounded-2xl text-white font-bold z-50 transition-all duration-300 ${isError ? 'bg-rose-600' : 'bg-emerald-600'} shadow-2xl`;
    toast.style.animation = 'slideUp 0.3s ease-out';
    toast.innerText = message;
    document.body.appendChild(toast);
    
    setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translate(-50%, 20px)';
        setTimeout(() => toast.remove(), 300);
    }, 3000);
}

async function showSummaryInPWA() {
    try {
        const res = await fetch('/api/meds');
        const meds = await res.json();
        
        if (!meds.length) {
            showToast('📋 Нет активных лекарств');
            return;
        }
        
        let summary = '📋 Сводка и прогноз:\n\n';
        for (const med of meds) {
            summary += `💊 ${med.name} (${med.is_started ? '▶️ Идет прием' : '⏸ Ожидание'})\n`;
            summary += `   Запас: ${med.days_left} дн. | Доза: ${med.daily_mg} ${med.dose_label}/сут\n`;
            summary += `   Расписание: ${med.schedule || 'не указано'}\n`;
            if (med.course_days > 0) {
                summary += `   Курс: ${med.course_days} дн.\n`;
            }
            summary += '⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯\n';
        }
        alert(summary);
    } catch (err) {
        console.error(err);
        showToast('❌ Ошибка загрузки сводки');
    }
}

async function showScheduleSettings() {
    try {
        const res = await fetch('/api/meds');
        const meds = await res.json();
        
        if (!meds.length) {
            showToast('📋 Нет лекарств для настройки расписания');
            return;
        }
        
        let medList = 'Выберите лекарство для настройки расписания:\n';
        meds.forEach((med, idx) => {
            medList += `\n${idx + 1}. ${med.name}`;
        });
        
        const choice = prompt(medList + '\n\nВведите номер лекарства:');
        if (choice) {
            const idx = parseInt(choice) - 1;
            if (meds[idx]) {
                alert(`Настройка расписания для "${meds[idx].name}"\n\nВ Telegram-боте доступна полная настройка:\n- Выберите день недели\n- Укажите время (например: 08:00, 20:00)\n\nОткройте бота для детальной настройки.`);
            }
        }
    } catch (err) {
        console.error(err);
    }
}
