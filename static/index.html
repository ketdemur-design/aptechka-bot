<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Моя Аптечка</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
        * { font-family: 'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif; }
        body {
            background: var(--bg);
            color: var(--text-primary);
            transition: background-color 0.3s ease, color 0.3s ease;
            background-image: radial-gradient(circle at 100% 0%, rgba(99,102,241,0.15) 0%, transparent 50%),
                              radial-gradient(circle at 0% 100%, rgba(168,85,247,0.1) 0%, transparent 50%);
            background-attachment: fixed;
        }
        :root {
            --bg: #e2e8f0;
            --surface: #ffffff;
            --surface-hover: #f1f5f9;
            --btn-secondary: #cbd5e1;
            --text-primary: #0f172a;
            --text-secondary: #475569;
        }
        .dark {
            --bg: #090b11;
            --surface: #1a1f2e;
            --surface-hover: #252b3d;
            --btn-secondary: #2d3446;
            --text-primary: #ffffff;
            --text-secondary: #94a3b8;
        }
        .glass {
            background: var(--surface);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.05);
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05), 0 8px 10px -6px rgba(0,0,0,0.05);
        }
        .dark .glass {
            background: linear-gradient(135deg, rgba(30,41,59,0.7) 0%, rgba(15,23,42,0.8) 100%);
            border-color: rgba(255,255,255,0.1);
        }
        .progress-bar {
            transition: width 0.8s cubic-bezier(0.2, 0.9, 0.4, 1.1);
        }
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(4px);
            align-items: center;
            justify-content: center;
            z-index: 50;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: var(--surface);
            border-radius: 2rem;
            max-width: 90%;
            width: 400px;
            padding: 1.5rem;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translate(-50%, 20px); }
            to { opacity: 1; transform: translate(-50%, 0); }
        }
        .toast-notification {
            animation: slideUp 0.3s ease-out;
        }
    </style>
</head>
<body class="pb-20 px-4 pt-8 max-w-lg mx-auto">
    <header class="flex items-center justify-between mb-10">
        <div>
            <h1 class="text-3xl font-extrabold tracking-tight bg-gradient-to-r from-[var(--text-primary)] to-[var(--text-secondary)] bg-clip-text text-transparent">
                Мои лекарства
            </h1>
            <p class="text-[var(--text-secondary)] text-sm font-medium mt-1">Будьте здоровы и не пропускайте приём</p>
        </div>
        <div class="flex items-center gap-2">
            <button id="themeToggle" class="p-2.5 glass rounded-2xl hover:bg-[var(--surface-hover)] transition-colors group">
                <svg id="themeIcon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
            </button>
            <button id="refreshBtn" class="p-2.5 glass rounded-2xl hover:bg-[var(--surface-hover)] transition-colors group">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
            </button>
        </div>
    </header>

    <div class="grid grid-cols-2 gap-4 mb-8">
        <div class="glass p-5 rounded-[2rem] card-shadow">
            <div class="flex items-center gap-3 mb-2">
                <div class="p-2 bg-emerald-400/10 rounded-xl text-emerald-400">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
                </div>
                <span class="text-[var(--text-secondary)] text-xs font-bold uppercase tracking-wider">Активные</span>
            </div>
            <div id="activeCount" class="text-3xl font-bold text-[var(--text-primary)]">0</div>
        </div>
        <div class="glass p-5 rounded-[2rem] card-shadow">
            <div class="flex items-center gap-3 mb-2">
                <div class="p-2 bg-amber-400/10 rounded-xl text-amber-400">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m21 16-4 4-4-4"/><path d="M17 20V4"/><path d="m3 8 4-4 4 4"/><path d="M7 4v16"/></svg>
                </div>
                <span class="text-[var(--text-secondary)] text-xs font-bold uppercase tracking-wider">Заканчиваются</span>
            </div>
            <div id="expiringCount" class="text-3xl font-bold text-[var(--text-primary)]">0</div>
        </div>
    </div>

    <div class="flex items-center justify-between mb-6">
        <h2 class="text-xs font-bold text-[var(--text-secondary)] uppercase tracking-[0.2em] pl-2">Текущий график</h2>
        <button id="addMedBtn" class="bg-violet-600 text-white px-4 py-2 rounded-full text-sm font-bold flex items-center gap-1 shadow-lg hover:bg-violet-700 transition">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
            Добавить
        </button>
    </div>

    <div id="medsList" class="space-y-4"></div>

    <!-- Модальное окно -->
    <div id="addModal" class="modal">
        <div class="modal-content">
            <div id="wizardContent"></div>
        </div>
    </div>

    <!-- Floating Action Bar -->
    <div class="fixed bottom-8 left-1/2 -translate-x-1/2 w-full max-w-[calc(512px-32px)] px-4">
        <div class="glass h-16 rounded-full flex items-center justify-around px-8 shadow-2xl border-t border-white/10">
            <button class="text-violet-400 bottom-calendar">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/></svg>
            </button>
            <button class="text-[var(--text-secondary)] hover:text-[var(--text-primary)] bottom-schedule">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
            </button>
            <button class="text-[var(--text-secondary)] hover:text-[var(--text-primary)] bottom-reminder">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            </button>
        </div>
    </div>

    <script>
        let medsData = [];
        let addWizardStep = 0;
        let addWizardData = {};

        const FORM_LABELS = {
            tablets: ["таблетке", "таблеток"],
            capsules: ["капсуле", "капсул"],
            liquid: ["бутылке", "бутылок"],
            drops: ["флаконе", "флаконов"],
            spray: ["флаконе", "флаконов"],
            sachet: ["саше", "саше"]
        };

        const medsContainer = document.getElementById('medsList');
        const activeCountSpan = document.getElementById('activeCount');
        const expiringCountSpan = document.getElementById('expiringCount');
        const refreshBtn = document.getElementById('refreshBtn');
        const themeToggle = document.getElementById('themeToggle');
        const addMedBtn = document.getElementById('addMedBtn');
        const addModal = document.getElementById('addModal');
        const wizardContent = document.getElementById('wizardContent');

        function initTheme() {
            const saved = localStorage.getItem('theme');
            const isDark = saved === 'dark' || (saved === null && window.matchMedia('(prefers-color-scheme: dark)').matches);
            if (isDark) document.documentElement.classList.add('dark');
            else document.documentElement.classList.remove('dark');
        }
        
        function toggleTheme() {
            document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
        }
        
        if (themeToggle) themeToggle.addEventListener('click', toggleTheme);
        initTheme();

        // API вызовы
        async function fetchMeds() {
            try {
                const res = await fetch('/api/meds', { cache: 'no-store' });
                if (!res.ok) throw new Error('Network error');
                medsData = await res.json();
                updateStats();
                renderMeds();
                return medsData;
            } catch (err) {
                console.error(err);
                if (medsContainer) {
                    medsContainer.innerHTML = '<div class="text-center py-10 text-[var(--text-secondary)]">Ошибка загрузки данных. Убедитесь, что сервер запущен.</div>';
                }
                return [];
            }
        }

        async function takeMed(chatId, medName) {
            try {
                const res = await fetch('/api/taken', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: chatId, med_name: medName })
                });
                if (res.ok) {
                    showToast('✅ Приём отмечен!');
                    await fetchMeds();
                } else {
                    showToast('❌ Не удалось отметить приём', true);
                }
            } catch (err) { 
                console.error(err);
                showToast('❌ Ошибка соединения', true);
            }
        }

        async function startCourse(chatId, medName) {
            try {
                const res = await fetch('/api/meds/start', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: chatId, med_name: medName })
                });
                if (res.ok) {
                    showToast(`✅ Курс "${medName}" начат!`);
                    await fetchMeds();
                } else {
                    showToast('❌ Ошибка старта курса', true);
                }
            } catch (err) { 
                console.error(err);
                showToast('❌ Ошибка соединения', true);
            }
        }

        async function deleteMed(chatId, medName) {
            if (!confirm(`Удалить "${medName}"?`)) return;
            try {
                const res = await fetch(`/api/meds?chat_id=${chatId}&med_name=${encodeURIComponent(medName)}`, {
                    method: 'DELETE'
                });
                if (res.ok) {
                    showToast('🗑 Лекарство удалено');
                    await fetchMeds();
                } else {
                    showToast('❌ Ошибка удаления', true);
                }
            } catch (err) { 
                console.error(err);
                showToast('❌ Ошибка соединения', true);
            }
        }

        async function updateMed(chatId, medName, field, value) {
            const body = field === 'dose' ? { daily_mg: value } : { add_stock: value };
            try {
                const res = await fetch('/api/meds/update', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: chatId, med_name: medName, ...body })
                });
                if (res.ok) {
                    const result = await res.json();
                    showToast(result.message);
                    await fetchMeds();
                } else {
                    showToast('❌ Ошибка обновления', true);
                }
            } catch (err) { 
                console.error(err);
                showToast('❌ Ошибка соединения', true);
            }
        }

        // Мастер добавления
        function showAddWizard() {
            addWizardStep = 0;
            addWizardData = {};
            addModal.classList.add('active');
            renderWizardStep();
        }

        function renderWizardStep() {
            if (!wizardContent) return;

            if (addWizardStep === 0) {
                wizardContent.innerHTML = `
                    <h3 class="text-xl font-bold mb-4 text-[var(--text-primary)]">Новое лекарство</h3>
                    <input type="text" id="wizardName" placeholder="Название лекарства" class="w-full p-3 rounded-xl bg-[var(--surface-hover)] text-[var(--text-primary)] mb-4 border border-white/10" autocomplete="off">
                    <div class="flex gap-3">
                        <button id="wizardNextBtn" class="flex-1 bg-emerald-600 text-white py-3 rounded-xl font-bold">Далее</button>
                        <button id="wizardCancelBtn" class="flex-1 bg-rose-600 text-white py-3 rounded-xl font-bold">Отмена</button>
                    </div>
                `;
                document.getElementById('wizardNextBtn').onclick = () => {
                    const name = document.getElementById('wizardName').value.trim();
                    if (!name) {
                        showToast('❌ Введите название лекарства', true);
                        return;
                    }
                    addWizardData.name = name;
                    addWizardStep = 1;
                    renderWizardStep();
                };
                document.getElementById('wizardCancelBtn').onclick = () => {
                    addModal.classList.remove('active');
                };
            } 
            else if (addWizardStep === 1) {
                wizardContent.innerHTML = `
                    <h3 class="text-xl font-bold mb-4 text-[var(--text-primary)]">Выберите форму</h3>
                    <div class="grid grid-cols-2 gap-3 mb-4">
                        <button data-form="tablets" class="wizard-form-btn p-3 rounded-xl bg-[var(--surface-hover)] text-[var(--text-primary)] font-medium hover:bg-violet-500/20">💊 Таблетки</button>
                        <button data-form="capsules" class="wizard-form-btn p-3 rounded-xl bg-[var(--surface-hover)] text-[var(--text-primary)] font-medium hover:bg-violet-500/20">💊 Капсулы</button>
                        <button data-form="drops" class="wizard-form-btn p-3 rounded-xl bg-[var(--surface-hover)] text-[var(--text-primary)] font-medium hover:bg-violet-500/20">👁 Капли</button>
                        <button data-form="spray" class="wizard-form-btn p-3 rounded-xl bg-[var(--surface-hover)] text-[var(--text-primary)] font-medium hover:bg-violet-500/20">💨 Спрей</button>
                        <button data-form="sachet" class="wizard-form-btn p-3 rounded-xl bg-[var(--surface-hover)] text-[var(--text-primary)] font-medium hover:bg-violet-500/20">📦 Саше</button>
                        <button data-form="liquid" class="wizard-form-btn p-3 rounded-xl bg-[var(--surface-hover)] text-[var(--text-primary)] font-medium hover:bg-violet-500/20">🧴 Жидкость</button>
                    </div>
                    <button id="wizardBackBtn" class="w-full p-3 rounded-xl bg-[var(--btn-secondary)] text-[var(--text-primary)] font-bold">Назад</button>
                `;
                document.querySelectorAll('.wizard-form-btn').forEach(btn => {
                    btn.onclick = () => {
                        addWizardData.form = btn.dataset.form;
                        addWizardStep = 2;
                        renderWizardStep();
                    };
                });
                document.getElementById('wizardBackBtn').onclick = () => {
                    addWizardStep = 0;
                    renderWizardStep();
                };
            }
            else if (addWizardStep === 2) {
                const form = addWizardData.form;
                const label = FORM_LABELS[form] || ["единице", "единиц"];
                let question = "";
                if (form === "drops") question = "Объем флакона (мл)?";
                else if (form === "spray") question = "Сколько мл в одном флаконе?";
                else if (form === "liquid") question = "Сколько мл в одной единице?";
                else question = `Сколько мг в одной ${label[0]}?`;
                
                wizardContent.innerHTML = `
                    <h3 class="text-xl font-bold mb-4 text-[var(--text-primary)]">${question}</h3>
                    <input type="number" step="any" id="wizardUnitMg" placeholder="Введите значение" class="w-full p-3 rounded-xl bg-[var(--surface-hover)] text-[var(--text-primary)] mb-4 border border-white/10">
                    <div class="flex gap-3">
                        <button id="wizardNextBtn" class="flex-1 bg-emerald-600 text-white py-3 rounded-xl font-bold">Далее</button>
                        <button id="wizardBackBtn" class="flex-1 bg-[var(--btn-secondary)] text-[var(--text-primary)] py-3 rounded-xl font-bold">Назад</button>
                    </div>
                `;
                document.getElementById('wizardNextBtn').onclick = () => {
                    const val = parseFloat(document.getElementById('wizardUnitMg').value);
                    if (isNaN(val) || val <= 0) {
                        showToast('❌ Введите корректное значение', true);
                        return;
                    }
                    addWizardData.unit_mg = val;
                    addWizardStep = 3;
                    renderWizardStep();
                };
                document.getElementById('wizardBackBtn').onclick = () => {
                    addWizardStep = 1;
                    renderWizardStep();
                };
            }
            else if (addWizardStep === 3) {
                const plural = FORM_LABELS[addWizardData.form]?.[1] || "единиц";
                wizardContent.innerHTML = `
                    <h3 class="text-xl font-bold mb-4 text-[var(--text-primary)]">Сколько ${plural} купили?</h3>
                    <input type="number" step="any" id="wizardUnits" placeholder="Количество" class="w-full p-3 rounded-xl bg-[var(--surface-hover)] text-[var(--text-primary)] mb-4 border border-white/10">
                    <div class="flex gap-3">
                        <button id="wizardNextBtn" class="flex-1 bg-emerald-600 text-white py-3 rounded-xl font-bold">Далее</button>
                        <button id="wizardBackBtn" class="flex-1 bg-[var(--btn-secondary)] text-[var(--text-primary)] py-3 rounded-xl font-bold">Назад</button>
                    </div>
                `;
                document.getElementById('wizardNextBtn').onclick = () => {
                    const val = parseFloat(document.getElementById('wizardUnits').value);
                    if (isNaN(val) || val <= 0) {
                        showToast('❌ Введите корректное количество', true);
                        return;
                    }
                    addWizardData.units = val;
                    addWizardStep = 4;
                    renderWizardStep();
                };
                document.getElementById('wizardBackBtn').onclick = () => {
                    addWizardStep = 2;
                    renderWizardStep();
                };
            }
            else if (addWizardStep === 4) {
                let doseUnit = "мг";
                if (addWizardData.form === "drops") doseUnit = "капель";
                else if (addWizardData.form === "spray") doseUnit = "впрыскиваний";
                else if (addWizardData.form === "liquid") doseUnit = "мл";
                
                wizardContent.innerHTML = `
                    <h3 class="text-xl font-bold mb-4 text-[var(--text-primary)]">Сколько ${doseUnit} в сутки принимаете?</h3>
                    <input type="number" step="any" id="wizardDailyMg" placeholder="Суточная дозировка" class="w-full p-3 rounded-xl bg-[var(--surface-hover)] text-[var(--text-primary)] mb-4 border border-white/10">
                    <div class="flex gap-3">
                        <button id="wizardNextBtn" class="flex-1 bg-emerald-600 text-white py-3 rounded-xl font-bold">Далее</button>
                        <button id="wizardBackBtn" class="flex-1 bg-[var(--btn-secondary)] text-[var(--text-primary)] py-3 rounded-xl font-bold">Назад</button>
                    </div>
                `;
                document.getElementById('wizardNextBtn').onclick = () => {
                    const val = parseFloat(document.getElementById('wizardDailyMg').value);
                    if (isNaN(val) || val <= 0) {
                        showToast('❌ Введите корректную дозировку', true);
                        return;
                    }
                    addWizardData.daily_mg = val;
                    addWizardStep = 5;
                    renderWizardStep();
                };
                document.getElementById('wizardBackBtn').onclick = () => {
                    addWizardStep = 3;
                    renderWizardStep();
                };
            }
            else if (addWizardStep === 5) {
                wizardContent.innerHTML = `
                    <h3 class="text-xl font-bold mb-4 text-[var(--text-primary)]">Срок приёма</h3>
                    <div class="grid grid-cols-1 gap-3 mb-4">
                        <button id="courseDaysBtn" class="p-3 rounded-xl bg-[var(--surface-hover)] text-[var(--text-primary)] font-medium hover:bg-emerald-500/20">📆 Количество дней</button>
                        <button id="courseMonthsBtn" class="p-3 rounded-xl bg-[var(--surface-hover)] text-[var(--text-primary)] font-medium hover:bg-emerald-500/20">🗓 Количество месяцев</button>
                        <button id="courseForeverBtn" class="p-3 rounded-xl bg-[var(--surface-hover)] text-[var(--text-primary)] font-medium hover:bg-emerald-500/20">♾ Пожизненно</button>
                    </div>
                    <button id="wizardBackBtn" class="w-full p-3 rounded-xl bg-[var(--btn-secondary)] text-[var(--text-primary)] font-bold">Назад</button>
                `;
                
                document.getElementById('courseDaysBtn').onclick = () => showCourseValueInput('days');
                document.getElementById('courseMonthsBtn').onclick = () => showCourseValueInput('months');
                document.getElementById('courseForeverBtn').onclick = () => {
                    addWizardData.course_days = 0;
                    finishAddWizard();
                };
                document.getElementById('wizardBackBtn').onclick = () => {
                    addWizardStep = 4;
                    renderWizardStep();
                };
                
                const showCourseValueInput = (type) => {
                    const unit = type === 'months' ? 'месяцев' : 'дней';
                    wizardContent.innerHTML = `
                        <h3 class="text-xl font-bold mb-4 text-[var(--text-primary)]">Введите количество ${unit}</h3>
                        <input type="number" id="wizardCourseValue" placeholder="Количество" class="w-full p-3 rounded-xl bg-[var(--surface-hover)] text-[var(--text-primary)] mb-4 border border-white/10">
                        <div class="flex gap-3">
                            <button id="wizardCourseConfirmBtn" class="flex-1 bg-emerald-600 text-white py-3 rounded-xl font-bold">Сохранить</button>
                            <button id="wizardCourseBackBtn" class="flex-1 bg-[var(--btn-secondary)] text-[var(--text-primary)] py-3 rounded-xl font-bold">Назад</button>
                        </div>
                    `;
                    document.getElementById('wizardCourseConfirmBtn').onclick = () => {
                        let val = parseInt(document.getElementById('wizardCourseValue').value);
                        if (isNaN(val) || val <= 0) {
                            showToast('❌ Введите корректное количество', true);
                            return;
                        }
                        if (type === 'months') val *= 30;
                        addWizardData.course_days = val;
                        finishAddWizard();
                    };
                    document.getElementById('wizardCourseBackBtn').onclick = () => {
                        addWizardStep = 5;
                        renderWizardStep();
                    };
                };
            }
        }

        async function finishAddWizard() {
            console.log('=== Отправка данных на сервер ===');
            console.log('Данные:', {
                name: addWizardData.name,
                form: addWizardData.form,
                unit_mg: addWizardData.unit_mg,
                units: addWizardData.units,
                daily_mg: addWizardData.daily_mg,
                course_days: addWizardData.course_days || 0
            });
            
            try {
                // Пробуем отправить запрос
                const res = await fetch('/api/meds/add', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        name: addWizardData.name,
                        form: addWizardData.form,
                        unit_mg: addWizardData.unit_mg,
                        units: addWizardData.units,
                        daily_mg: addWizardData.daily_mg,
                        course_days: addWizardData.course_days || 0
                    })
                });
                
                console.log('Ответ сервера:', res.status, res.statusText);
                
                if (res.ok) {
                    const result = await res.json();
                    console.log('Успех:', result);
                    showToast('✅ Лекарство успешно добавлено!');
                    addModal.classList.remove('active');
                    await fetchMeds();
                } else {
                    const err = await res.json();
                    console.error('Ошибка сервера:', err);
                    showToast('❌ Ошибка: ' + (err.detail || 'неизвестная'), true);
                }
            } catch (err) {
                console.error('Ошибка соединения:', err);
                showToast('❌ Ошибка соединения с сервером. Проверьте, запущен ли сервер на порту 3000', true);
            }
        }

        function showToast(message, isError = false) {
            const existingToast = document.querySelector('.toast-notification');
            if (existingToast) existingToast.remove();
            
            const toast = document.createElement('div');
            toast.className = `toast-notification fixed bottom-28 left-1/2 -translate-x-1/2 px-5 py-3 rounded-2xl text-white font-bold z-50 ${isError ? 'bg-rose-600' : 'bg-emerald-600'} shadow-2xl`;
            toast.innerText = message;
            document.body.appendChild(toast);
            
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translate(-50%, 20px)';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }
