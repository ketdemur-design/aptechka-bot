<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Моя Аптечка</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
        * { font-family: 'Plus Jakarta Sans', sans-serif; }
        body {
            background: var(--bg);
            color: var(--text-primary);
            transition: background-color 0.3s ease;
        }
        :root {
            --bg: #e2e8f0;
            --surface: #ffffff;
            --text-primary: #0f172a;
            --text-secondary: #475569;
        }
        .dark {
            --bg: #090b11;
            --surface: #1a1f2e;
            --text-primary: #ffffff;
            --text-secondary: #94a3b8;
        }
        .glass {
            background: var(--surface);
            border-radius: 2rem;
            padding: 1.5rem;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(4px);
            align-items: center;
            justify-content: center;
            z-index: 50;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: var(--surface);
            border-radius: 2rem;
            max-width: 90%;
            width: 400px;
            padding: 1.5rem;
            max-height: 80vh;
            overflow-y: auto;
        }
        .step-hidden { display: none; }
    </style>
</head>
<body class="pb-20 px-4 pt-8 max-w-lg mx-auto">
    <header class="flex justify-between mb-10">
        <div>
            <h1 class="text-3xl font-bold">Мои лекарства</h1>
            <p class="text-sm opacity-70">Будьте здоровы</p>
        </div>
        <div class="flex gap-2">
            <button id="themeToggle" class="p-2 glass">🌓</button>
            <button id="refreshBtn" class="p-2 glass">🔄</button>
        </div>
    </header>

    <div class="grid grid-cols-2 gap-4 mb-8">
        <div class="glass">
            <div class="text-3xl font-bold" id="activeCount">0</div>
            <div class="text-xs">Активных</div>
        </div>
        <div class="glass">
            <div class="text-3xl font-bold" id="expiringCount">0</div>
            <div class="text-xs">Заканчиваются</div>
        </div>
    </div>

    <div class="flex justify-between mb-6">
        <h2 class="text-sm font-bold">Список лекарств</h2>
        <button id="addMedBtn" class="bg-purple-600 text-white px-4 py-2 rounded-full text-sm">+ Добавить</button>
    </div>

    <div id="medsList" class="space-y-4"></div>

    <!-- Модальное окно -->
    <div id="addModal" class="modal">
        <div class="modal-content">
            <h3 class="text-xl font-bold mb-4">Новое лекарство</h3>
            <div id="step1">
                <input type="text" id="medName" placeholder="Название" class="w-full p-3 rounded-xl bg-gray-100 dark:bg-gray-800 mb-3">
                <button id="nextStep1" class="w-full bg-purple-600 text-white py-3 rounded-xl">Далее</button>
            </div>
            <div id="step2" class="step-hidden">
                <div class="grid grid-cols-2 gap-2 mb-4">
                    <button data-form="tablets" class="form-btn p-3 rounded-xl bg-gray-100 dark:bg-gray-800">💊 Таблетки</button>
                    <button data-form="capsules" class="form-btn p-3 rounded-xl bg-gray-100 dark:bg-gray-800">💊 Капсулы</button>
                    <button data-form="drops" class="form-btn p-3 rounded-xl bg-gray-100 dark:bg-gray-800">💧 Капли</button>
                    <button data-form="spray" class="form-btn p-3 rounded-xl bg-gray-100 dark:bg-gray-800">💨 Спрей</button>
                    <button data-form="liquid" class="form-btn p-3 rounded-xl bg-gray-100 dark:bg-gray-800">🧴 Жидкость</button>
                    <button data-form="sachet" class="form-btn p-3 rounded-xl bg-gray-100 dark:bg-gray-800">📦 Саше</button>
                </div>
                <button id="backStep2" class="w-full bg-gray-500 text-white py-3 rounded-xl">Назад</button>
            </div>
            <div id="step3" class="step-hidden">
                <p id="unitQuestion" class="mb-3">Сколько мг в единице?</p>
                <input type="number" id="medUnitMg" step="any" class="w-full p-3 rounded-xl bg-gray-100 dark:bg-gray-800 mb-3">
                <button id="nextStep3" class="w-full bg-purple-600 text-white py-3 rounded-xl">Далее</button>
                <button id="backStep3" class="w-full bg-gray-500 text-white py-3 rounded-xl mt-2">Назад</button>
            </div>
            <div id="step4" class="step-hidden">
                <p id="unitsQuestion" class="mb-3">Сколько единиц?</p>
                <input type="number" id="medUnits" class="w-full p-3 rounded-xl bg-gray-100 dark:bg-gray-800 mb-3">
                <button id="nextStep4" class="w-full bg-purple-600 text-white py-3 rounded-xl">Далее</button>
                <button id="backStep4" class="w-full bg-gray-500 text-white py-3 rounded-xl mt-2">Назад</button>
            </div>
            <div id="step5" class="step-hidden">
                <p id="dailyQuestion" class="mb-3">Суточная дозировка?</p>
                <input type="number" id="medDailyMg" step="any" class="w-full p-3 rounded-xl bg-gray-100 dark:bg-gray-800 mb-3">
                <button id="nextStep5" class="w-full bg-purple-600 text-white py-3 rounded-xl">Далее</button>
                <button id="backStep5" class="w-full bg-gray-500 text-white py-3 rounded-xl mt-2">Назад</button>
            </div>
            <div id="step6" class="step-hidden">
                <p class="mb-3 font-bold">Срок приёма:</p>
                <button id="courseDays" class="w-full p-3 rounded-xl bg-gray-100 dark:bg-gray-800 mb-2">📆 Дни</button>
                <button id="courseMonths" class="w-full p-3 rounded-xl bg-gray-100 dark:bg-gray-800 mb-2">🗓 Месяцы</button>
                <button id="courseForever" class="w-full p-3 rounded-xl bg-gray-100 dark:bg-gray-800 mb-4">♾ Пожизненно</button>
                <div id="courseValueInput" class="hidden">
                    <input type="number" id="courseValue" placeholder="Количество" class="w-full p-3 rounded-xl bg-gray-100 dark:bg-gray-800 mb-3">
                    <button id="submitCourse" class="w-full bg-green-600 text-white py-3 rounded-xl">Сохранить</button>
                </div>
                <button id="backStep6" class="w-full bg-gray-500 text-white py-3 rounded-xl mt-2">Назад</button>
            </div>
        </div>
    </div>

    <script>
        let medsData = [];
        let addState = { step: 1, name: '', form: '', unit_mg: null, units: null, daily_mg: null, course_value: null };

        // Helper functions
        async function fetchMeds() {
            try {
                const res = await fetch('/api/meds');
                medsData = await res.json();
                document.getElementById('activeCount').innerText = medsData.filter(m => m.is_started).length;
                document.getElementById('expiringCount').innerText = medsData.filter(m => m.days_left <= 7 && m.days_left > 0).length;
                renderMeds();
            } catch(e) { console.error(e); }
        }

        async function takeMed(chatId, name) {
            try {
                const res = await fetch('/api/taken', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: chatId, med_name: name })
                });
                if (res.ok) fetchMeds();
                else alert('Ошибка');
            } catch(e) { console.error(e); }
        }

        async function startCourse(chatId, name) {
            try {
                const res = await fetch('/api/meds/start', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: chatId, med_name: name })
                });
                if (res.ok) fetchMeds();
                else alert('Ошибка');
            } catch(e) { console.error(e); }
        }

        async function deleteMed(chatId, name) {
            if (!confirm('Удалить?')) return;
            try {
                const res = await fetch('/api/meds', {
                    method: 'DELETE',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: chatId, med_name: name })
                });
                if (res.ok) fetchMeds();
                else alert('Ошибка');
            } catch(e) { console.error(e); }
        }

        async function updateMed(chatId, name, field, value) {
            const body = field === 'dose' ? { daily_mg: value } : { add_stock: value };
            try {
                const res = await fetch('/api/meds/update', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: chatId, med_name: name, ...body })
                });
                if (res.ok) fetchMeds();
                else alert('Ошибка');
            } catch(e) { console.error(e); }
        }

        function renderMeds() {
            const container = document.getElementById('medsList');
            if (!medsData.length) {
                container.innerHTML = '<div class="text-center py-10">Нет лекарств. Добавьте через бот или кнопку "+"</div>';
                return;
            }
            container.innerHTML = medsData.map(med => `
                <div class="glass">
                    <div class="flex justify-between items-start mb-4">
                        <div>
                            <h3 class="font-bold text-lg">${med.name}</h3>
                            <p class="text-sm opacity-70">${med.dose_line || ''}</p>
                        </div>
                        <button onclick="deleteMed('${med.chat_id}', '${med.name.replace(/'/g, "\\'")}')" class="text-red-500">🗑</button>
                    </div>
                    <div class="mb-4">
                        <div class="flex justify-between text-sm mb-1">
                            <span>Осталось: ${med.days_left} дн.</span>
                            <span>${med.progress || 0}%</span>
                        </div>
                        <div class="h-2 bg-gray-200 rounded-full overflow-hidden">
                            <div class="h-full bg-purple-600 rounded-full" style="width: ${med.progress || 0}%"></div>
                        </div>
                    </div>
                    <div class="flex gap-2 mb-4">
                        <button onclick="handleRefill('${med.chat_id}', '${med.name.replace(/'/g, "\\'")}')" class="flex-1 py-2 bg-gray-200 dark:bg-gray-800 rounded-xl text-sm">➕ Пополнить</button>
                        <button onclick="handleChangeDose('${med.chat_id}', '${med.name.replace(/'/g, "\\'")}')" class="flex-1 py-2 bg-gray-200 dark:bg-gray-800 rounded-xl text-sm">⚙️ Дозировка</button>
                    </div>
                    ${!med.is_started ? 
                        `<button onclick="startCourse('${med.chat_id}', '${med.name.replace(/'/g, "\\'")}')" class="w-full py-3 bg-green-600 text-white rounded-xl font-bold">▶️ Начать курс</button>` :
                        `<button onclick="takeMed('${med.chat_id}', '${med.name.replace(/'/g, "\\'")}')" class="w-full py-3 bg-purple-600 text-white rounded-xl font-bold">✅ Выпил</button>`
                    }
                </div>
            `).join('');
        }

        window.handleRefill = (chatId, name) => {
            let val = prompt('Сколько добавить?');
            if (val && !isNaN(parseFloat(val))) updateMed(chatId, name, 'refill', parseFloat(val));
        };
        window.handleChangeDose = (chatId, name) => {
            let val = prompt('Новая суточная дозировка:');
            if (val && !isNaN(parseFloat(val))) updateMed(chatId, name, 'dose', parseFloat(val));
        };

        // Модальное окно
        const modal = document.getElementById('addModal');
        document.getElementById('addMedBtn').onclick = () => modal.classList.add('active');
        
        function showStep(step) {
            ['step1','step2','step3','step4','step5','step6'].forEach((id, i) => {
                document.getElementById(id).classList.toggle('step-hidden', i+1 !== step);
            });
        }

        document.getElementById('nextStep1').onclick = () => {
            let name = document.getElementById('medName').value.trim();
            if (!name) { alert('Введите название'); return; }
            addState.name = name;
            addState.step = 2;
            showStep(2);
        };
        
        document.querySelectorAll('.form-btn').forEach(btn => {
            btn.onclick = () => {
                addState.form = btn.dataset.form;
                let q = document.getElementById('unitQuestion');
                if (addState.form === 'drops') q.textContent = 'Объем флакона (мл)?';
                else if (addState.form === 'spray') q.textContent = 'Сколько мл в единице?';
                else if (addState.form === 'liquid') q.textContent = 'Сколько мл в единице?';
                else q.textContent = 'Сколько мг в единице?';
                addState.step = 3;
                showStep(3);
            };
        });
        
        document.getElementById('nextStep3').onclick = () => {
            let val = parseFloat(document.getElementById('medUnitMg').value);
            if (isNaN(val)) { alert('Введите значение'); return; }
            addState.unit_mg = val;
            let labels = { tablets: 'таблеток', capsules: 'капсул', drops: 'флаконов', spray: 'флаконов', liquid: 'бутылок', sachet: 'саше' };
            document.getElementById('unitsQuestion').textContent = `Сколько ${labels[addState.form]} купили?`;
            addState.step = 4;
            showStep(4);
        };
        
        document.getElementById('nextStep4').onclick = () => {
            let val = parseInt(document.getElementById('medUnits').value);
            if (isNaN(val)) { alert('Введите количество'); return; }
            addState.units = val;
            let q = document.getElementById('dailyQuestion');
            if (addState.form === 'drops') q.textContent = 'Сколько капель в сутки?';
            else if (addState.form === 'spray') q.textContent = 'Сколько впрыскиваний в сутки?';
            else if (addState.form === 'liquid') q.textContent = 'Сколько мл в сутки?';
            else q.textContent = 'Сколько мг в сутки?';
            addState.step = 5;
            showStep(5);
        };
        
        document.getElementById('nextStep5').onclick = () => {
            let val = parseFloat(document.getElementById('medDailyMg').value);
            if (isNaN(val)) { alert('Введите дозировку'); return; }
            addState.daily_mg = val;
            addState.step = 6;
            showStep(6);
            document.getElementById('courseValueInput').classList.add('hidden');
        };
        
        document.getElementById('courseDays').onclick = () => {
            document.getElementById('courseValueInput').classList.remove('hidden');
            document.getElementById('submitCourse').onclick = () => {
                let val = parseInt(document.getElementById('courseValue').value);
                if (isNaN(val)) { alert('Введите количество дней'); return; }
                addState.course_value = val;
                saveMedicine();
            };
        };
        
        document.getElementById('courseMonths').onclick = () => {
            document.getElementById('courseValueInput').classList.remove('hidden');
            document.getElementById('submitCourse').onclick = () => {
                let val = parseInt(document.getElementById('courseValue').value);
                if (isNaN(val)) { alert('Введите количество месяцев'); return; }
                addState.course_value = val * 30;
                saveMedicine();
            };
        };
        
        document.getElementById('courseForever').onclick = () => {
            addState.course_value = 0;
            saveMedicine();
        };
        
        async function saveMedicine() {
            try {
                const res = await fetch('/api/meds/add', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        name: addState.name,
                        form: addState.form,
                        unit_mg: addState.unit_mg,
                        units: addState.units,
                        daily_mg: addState.daily_mg,
                        course_days: addState.course_value
                    })
                });
                if (res.ok) {
                    modal.classList.remove('active');
                    fetchMeds();
                    // Сброс
                    addState = { step: 1 };
                    document.getElementById('medName').value = '';
                    document.getElementById('medUnitMg').value = '';
                    document.getElementById('medUnits').value = '';
                    document.getElementById('medDailyMg').value = '';
                    document.getElementById('courseValue').value = '';
                    showStep(1);
                } else alert('Ошибка сохранения');
            } catch(e) { console.error(e); alert('Ошибка'); }
        }
        
        // Назад
        document.getElementById('backStep2').onclick = () => { addState.step = 1; showStep(1); };
        document.getElementById('backStep3').onclick = () => { addState.step = 2; showStep(2); };
        document.getElementById('backStep4').onclick = () => { addState.step = 3; showStep(3); };
        document.getElementById('backStep5').onclick = () => { addState.step = 4; showStep(4); };
        document.getElementById('backStep6').onclick = () => { addState.step = 5; showStep(5); };
        
        modal.onclick = (e) => { if (e.target === modal) modal.classList.remove('active'); };
        
        // Тема
        let isDark = localStorage.getItem('theme') === 'dark';
        if (isDark) document.documentElement.classList.add('dark');
        document.getElementById('themeToggle').onclick = () => {
            document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
        };
        
        document.getElementById('refreshBtn').onclick = () => fetchMeds();
        
        fetchMeds();
        setInterval(fetchMeds, 30000);
    </script>
</body>
</html>
