<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="МедБот">
<title>МедБот — Мои лекарства</title>
<link rel="manifest" href="/manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  /* ── Reset & Base ── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:          #0f1117;
    --bg2:         #181c27;
    --bg3:         #1f2433;
    --border:      rgba(255,255,255,0.07);
    --accent:      #7c6af7;
    --accent2:     #a78bfa;
    --accent-glow: rgba(124,106,247,0.25);
    --green:       #34d399;
    --yellow:      #fbbf24;
    --red:         #f87171;
    --text:        #e8eaf0;
    --text2:       #8892aa;
    --text3:       #4a5468;
    --radius:      18px;
    --radius-sm:   10px;
    --safe-top:    env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  html { font-size: 16px; }
  body {
    font-family: 'Space Grotesk', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100dvh;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* ── App shell ── */
  .app-header {
    position: sticky;
    top: 0;
    z-index: 100;
    padding: calc(var(--safe-top) + 12px) 20px 14px;
    background: rgba(15,17,23,0.85);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .header-title {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 1.35rem;
    letter-spacing: -0.02em;
    background: linear-gradient(135deg, #fff 30%, var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .header-actions { display: flex; gap: 8px; align-items: center; }

  .icon-btn {
    width: 38px; height: 38px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--bg3);
    display: grid; place-items: center;
    cursor: pointer;
    font-size: 1rem;
    transition: background 0.2s, transform 0.15s;
    -webkit-tap-highlight-color: transparent;
  }
  .icon-btn:active { background: var(--bg2); transform: scale(0.93); }

  /* ── Content ── */
  .content {
    padding: 18px 16px calc(var(--safe-bottom) + 20px);
    max-width: 520px;
    margin: 0 auto;
  }

  /* ── Stats strip ── */
  .stats-strip {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 22px;
  }

  .stat-card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 12px 10px;
    text-align: center;
  }
  .stat-value {
    font-family: 'Syne', sans-serif;
    font-size: 1.5rem;
    font-weight: 700;
    line-height: 1;
    margin-bottom: 4px;
  }
  .stat-label { font-size: 0.7rem; color: var(--text2); text-transform: uppercase; letter-spacing: 0.05em; }

  /* ── Med cards ── */
  .section-label {
    font-size: 0.7rem;
    font-weight: 600;
    color: var(--text3);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-bottom: 10px;
    padding-left: 2px;
  }

  .cards-list { display: flex; flex-direction: column; gap: 14px; }

  .med-card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px;
    position: relative;
    overflow: hidden;
    transition: transform 0.2s, box-shadow 0.2s;
    animation: fadeUp 0.4s ease both;
  }
  .med-card:active { transform: scale(0.99); }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .med-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    opacity: 0;
    transition: opacity 0.3s;
  }
  .med-card.active-course::before { opacity: 1; }

  .card-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 14px;
  }

  .med-icon {
    width: 44px; height: 44px;
    border-radius: 12px;
    display: grid; place-items: center;
    font-size: 1.4rem;
    flex-shrink: 0;
  }
  .form-tablets  { background: rgba(124,106,247,0.15); }
  .form-capsules { background: rgba(167,139,250,0.15); }
  .form-drops    { background: rgba(52,211,153,0.15); }
  .form-spray    { background: rgba(251,191,36,0.15); }
  .form-liquid   { background: rgba(96,165,250,0.15); }
  .form-sachet   { background: rgba(248,113,113,0.15); }

  .med-info { flex: 1; min-width: 0; }
  .med-name {
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 1.05rem;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-bottom: 3px;
  }
  .med-sub { font-size: 0.78rem; color: var(--text2); }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 0.68rem;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 100px;
    flex-shrink: 0;
  }
  .badge-active   { background: rgba(52,211,153,0.15); color: var(--green); }
  .badge-paused   { background: rgba(255,255,255,0.06); color: var(--text2); }
  .badge-warning  { background: rgba(251,191,36,0.15); color: var(--yellow); }
  .badge-critical { background: rgba(248,113,113,0.15); color: var(--red); }

  /* ── Progress bar ── */
  .progress-section { margin-bottom: 14px; }
  .progress-meta {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 7px;
  }
  .progress-days {
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 1.1rem;
  }
  .progress-days span { font-size: 0.78rem; font-weight: 400; color: var(--text2); margin-left: 2px; }
  .progress-pct { font-size: 0.75rem; color: var(--text2); }

  .progress-track {
    height: 6px;
    background: var(--bg3);
    border-radius: 100px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    border-radius: 100px;
    transition: width 0.6s cubic-bezier(0.34,1.56,0.64,1);
  }

  /* ── Card meta row ── */
  .card-meta {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 14px;
  }
  .meta-chip {
    font-size: 0.72rem;
    color: var(--text2);
    background: var(--bg3);
    border-radius: 6px;
    padding: 4px 8px;
    display: flex;
    align-items: center;
    gap: 4px;
  }

  /* ── Take button ── */
  .take-btn {
    width: 100%;
    padding: 13px;
    border-radius: var(--radius-sm);
    border: none;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: 0.92rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    transition: opacity 0.2s, transform 0.15s, box-shadow 0.2s;
    box-shadow: 0 4px 20px var(--accent-glow);
    -webkit-tap-highlight-color: transparent;
  }
  .take-btn:active { opacity: 0.85; transform: scale(0.98); }
  .take-btn:disabled {
    background: var(--bg3);
    color: var(--text3);
    cursor: not-allowed;
    box-shadow: none;
  }

  .take-btn.loading {
    pointer-events: none;
  }
  .take-btn.loading .btn-icon { animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Toast ── */
  #toast {
    position: fixed;
    bottom: calc(var(--safe-bottom) + 20px);
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--bg3);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 11px 20px;
    border-radius: 100px;
    font-size: 0.85rem;
    font-weight: 500;
    z-index: 999;
    transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
    white-space: nowrap;
    pointer-events: none;
  }
  #toast.show { transform: translateX(-50%) translateY(0); }

  /* ── Empty / Error ── */
  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--text3);
  }
  .empty-state .emoji { font-size: 3rem; margin-bottom: 12px; }
  .empty-state p { font-size: 0.9rem; line-height: 1.6; }

  /* ── Skeleton loader ── */
  .skeleton {
    background: linear-gradient(90deg, var(--bg2) 25%, var(--bg3) 50%, var(--bg2) 75%);
    background-size: 200% 100%;
    animation: shimmer 1.4s infinite;
    border-radius: var(--radius-sm);
  }
  @keyframes shimmer { to { background-position: -200% 0; } }

  .skel-card {
    height: 180px;
    border-radius: var(--radius);
    margin-bottom: 14px;
  }

  /* ── Refresh indicator ── */
  .refresh-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--green);
    display: inline-block;
  }
  .refresh-dot.stale { background: var(--yellow); }

  /* ── Chat filter ── */
  .filter-row {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    margin-bottom: 18px;
    padding-bottom: 4px;
    scrollbar-width: none;
  }
  .filter-row::-webkit-scrollbar { display: none; }

  .filter-pill {
    flex-shrink: 0;
    font-size: 0.78rem;
    font-weight: 500;
    padding: 6px 14px;
    border-radius: 100px;
    border: 1px solid var(--border);
    background: var(--bg2);
    color: var(--text2);
    cursor: pointer;
    transition: all 0.15s;
    -webkit-tap-highlight-color: transparent;
  }
  .filter-pill.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

  /* ── Glow bg decoration ── */
  .bg-glow {
    position: fixed;
    pointer-events: none;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.12;
    z-index: 0;
  }
  .bg-glow-1 { width: 300px; height: 300px; background: var(--accent); top: -80px; right: -60px; }
  .bg-glow-2 { width: 250px; height: 250px; background: var(--green); bottom: 10%; left: -80px; }
  .content { position: relative; z-index: 1; }
</style>
</head>
<body>

<div class="bg-glow bg-glow-1"></div>
<div class="bg-glow bg-glow-2"></div>

<header class="app-header">
  <div>
    <div class="header-title">💊 МедБот</div>
  </div>
  <div class="header-actions">
    <div id="syncDot" class="refresh-dot" title="Данные актуальны"></div>
    <button class="icon-btn" id="refreshBtn" title="Обновить" aria-label="Обновить">↻</button>
  </div>
</header>

<main class="content">
  <!-- Stats strip -->
  <div class="stats-strip" id="statsStrip">
    <div class="stat-card skeleton" style="height:70px"></div>
    <div class="stat-card skeleton" style="height:70px"></div>
    <div class="stat-card skeleton" style="height:70px"></div>
  </div>

  <!-- Chat filter -->
  <div class="filter-row" id="filterRow" style="display:none"></div>

  <!-- Cards -->
  <div class="section-label" id="sectionLabel">Загрузка...</div>
  <div class="cards-list" id="cardsList">
    <div class="skel-card skeleton"></div>
    <div class="skel-card skeleton"></div>
  </div>
</main>

<div id="toast"></div>

<script>
// ─── State ────────────────────────────────────────────────────────────────────
let allMeds = [];
let activeChatId = 'all';
let lastFetch = 0;

// ─── Utils ───────────────────────────────────────────────────────────────────
const FORM_ICONS = {
  tablets:  '💊',
  capsules: '💊',
  drops:    '👁️',
  spray:    '💨',
  liquid:   '🧴',
  sachet:   '📦',
};

function daysColor(days) {
  if (days <= 3)  return 'var(--red)';
  if (days <= 7)  return 'var(--yellow)';
  return 'var(--green)';
}

function progressColor(pct) {
  if (pct >= 85) return 'var(--red)';
  if (pct >= 60) return 'var(--yellow)';
  return 'linear-gradient(90deg, var(--accent), var(--accent2))';
}

function daysBadge(days, isStarted) {
  if (!isStarted) return { cls: 'badge-paused', text: '⏸ Ожидание' };
  if (days <= 3)  return { cls: 'badge-critical', text: `⚠️ ${days} дн.` };
  if (days <= 7)  return { cls: 'badge-warning',  text: `🛒 ${days} дн.` };
  return { cls: 'badge-active', text: '▶ Приём' };
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2600);
}

// ─── Fetch meds ───────────────────────────────────────────────────────────────
async function fetchMeds(silent = false) {
  const dot = document.getElementById('syncDot');
  dot.className = 'refresh-dot stale';
  try {
    const res = await fetch('/api/meds');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    allMeds = await res.json();
    lastFetch = Date.now();
    dot.className = 'refresh-dot';
    renderAll();
  } catch(e) {
    dot.className = 'refresh-dot stale';
    if (!silent) showToast('⚠️ Не удалось загрузить данные');
  }
}

// ─── Render ───────────────────────────────────────────────────────────────────
function renderAll() {
  renderStats();
  renderFilters();
  renderCards();
}

function renderStats() {
  const meds = filteredMeds();
  const total   = meds.length;
  const active  = meds.filter(m => m.is_started).length;
  const warning = meds.filter(m => m.days_left <= 7 && m.is_started).length;

  document.getElementById('statsStrip').innerHTML = `
    <div class="stat-card">
      <div class="stat-value" style="color:var(--accent2)">${total}</div>
      <div class="stat-label">Лекарств</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" style="color:var(--green)">${active}</div>
      <div class="stat-label">Активных</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" style="color:${warning > 0 ? 'var(--yellow)' : 'var(--text2)'}">${warning}</div>
      <div class="stat-label">Заканчивается</div>
    </div>
  `;
}

function renderFilters() {
  const chatIds = [...new Set(allMeds.map(m => m.chat_id))];
  if (chatIds.length <= 1) {
    document.getElementById('filterRow').style.display = 'none';
    return;
  }
  const row = document.getElementById('filterRow');
  row.style.display = 'flex';
  row.innerHTML = `
    <button class="filter-pill ${activeChatId === 'all' ? 'active' : ''}" onclick="setFilter('all')">Все</button>
    ${chatIds.map(id => `
      <button class="filter-pill ${activeChatId === id ? 'active' : ''}" onclick="setFilter('${id}')">
        ID ${id.slice(-4)}
      </button>
    `).join('')}
  `;
}

function setFilter(id) {
  activeChatId = id;
  renderAll();
}

function filteredMeds() {
  if (activeChatId === 'all') return allMeds;
  return allMeds.filter(m => m.chat_id === activeChatId);
}

function renderCards() {
  const meds = filteredMeds();
  const label = document.getElementById('sectionLabel');
  const list  = document.getElementById('cardsList');

  if (meds.length === 0) {
    label.textContent = '';
    list.innerHTML = `
      <div class="empty-state">
        <div class="emoji">💊</div>
        <p>Лекарств пока нет.<br>Добавь их через Telegram-бот.</p>
      </div>
    `;
    return;
  }

  label.textContent = `${meds.length} ${meds.length === 1 ? 'лекарство' : meds.length < 5 ? 'лекарства' : 'лекарств'}`;

  // Sort: active first, then by days_left ascending
  const sorted = [...meds].sort((a, b) => {
    if (a.is_started !== b.is_started) return a.is_started ? -1 : 1;
    return a.days_left - b.days_left;
  });

  list.innerHTML = sorted.map((m, i) => cardHTML(m, i)).join('');
}

function cardHTML(m, i) {
  const badge   = daysBadge(m.days_left, m.is_started);
  const icon    = FORM_ICONS[m.form] || '💊';
  const fillPct = Math.min(100, m.progress);
  const bgColor = `form-${m.form}`;
  const dColor  = daysColor(m.days_left);
  const pColor  = progressColor(fillPct);
  const canTake = m.is_started && m.days_left > 0;
  const delay   = `animation-delay: ${i * 0.06}s`;

  const courseInfo = m.course_days
    ? `<span class="meta-chip">📆 ${m.course_days} дн. курс</span>`
    : `<span class="meta-chip">♾ Бессрочно</span>`;

  const schedule = m.schedule !== 'не установлено'
    ? `<span class="meta-chip">⏰ ${m.schedule.split('\n')[0]}</span>`
    : '';

  return `
    <div class="med-card ${m.is_started ? 'active-course' : ''}" style="${delay}">
      <div class="card-top">
        <div class="med-icon ${bgColor}">${icon}</div>
        <div class="med-info">
          <div class="med-name">${escHtml(m.name)}</div>
          <div class="med-sub">${m.dose_line}</div>
        </div>
        <span class="badge ${badge.cls}">${badge.text}</span>
      </div>

      <div class="progress-section">
        <div class="progress-meta">
          <div class="progress-days" style="color:${dColor}">
            ${m.days_left}<span>дн. осталось</span>
          </div>
          <div class="progress-pct">${Math.round(fillPct)}% использовано</div>
        </div>
        <div class="progress-track">
          <div class="progress-fill" style="width:${fillPct}%; background:${pColor}"></div>
        </div>
      </div>

      <div class="card-meta">
        ${courseInfo}
        ${schedule}
        <span class="meta-chip">${icon} Остаток: ${m.remaining_doses} ${m.dose_label}</span>
      </div>

      <button
        class="take-btn"
        ${canTake ? '' : 'disabled'}
        onclick="takeMed('${escAttr(m.chat_id)}', '${escAttr(m.name)}', this)"
      >
        <span class="btn-icon">✅</span>
        Приняла лекарство
      </button>
    </div>
  `;
}

// ─── Take medication ─────────────────────────────────────────────────────────
async function takeMed(chatId, medName, btn) {
  btn.classList.add('loading');
  btn.querySelector('.btn-icon').textContent = '⟳';
  btn.disabled = true;

  try {
    const res = await fetch('/api/taken', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ chat_id: chatId, med_name: medName }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || 'Ошибка');

    showToast(`✅ ${medName} — принято! Осталось ${data.days_left} дн.`);
    // Update local state optimistically
    const med = allMeds.find(m => m.chat_id === chatId && m.name === medName);
    if (med) {
      med.total_mg = data.new_total;
      med.days_left = data.days_left;
      const consumed = med.capacity_days - med.days_left;
      med.progress = med.capacity_days > 0 ? Math.round(consumed / med.capacity_days * 100) : 0;
    }
    renderCards();
    renderStats();
  } catch(e) {
    showToast('❌ ' + (e.message || 'Не удалось сохранить'));
    btn.disabled = false;
  } finally {
    btn.classList.remove('loading');
  }
}

// ─── Helpers ─────────────────────────────────────────────────────────────────
function escHtml(s)  { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function escAttr(s)  { return String(s).replace(/'/g,"\\'"); }
function capitalize(s) { return s ? s[0].toUpperCase() + s.slice(1) : s; }

// ─── Init ────────────────────────────────────────────────────────────────────
document.getElementById('refreshBtn').addEventListener('click', () => fetchMeds());

// Auto-refresh every 60 s
setInterval(() => fetchMeds(true), 60_000);

// PWA service worker
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/service-worker.js').catch(() => {});
}

// First load
fetchMeds();
</script>
</body>
</html>
