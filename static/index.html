<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>Моя Аптечка</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
*,*::before,*::after{font-family:'Plus Jakarta Sans',ui-sans-serif,system-ui,sans-serif}

/* ── ПЕРЕМЕННЫЕ ── */
:root{
  --bg:#e2e8f0;--surface:#ffffff;--surface-hover:#f1f5f9;
  --btn-secondary:#cbd5e1;--text-primary:#0f172a;--text-secondary:#475569;
}
.dark{
  --bg:#090b11;--surface:#1a1f2e;--surface-hover:#252b3d;
  --btn-secondary:#2d3446;--text-primary:#ffffff;--text-secondary:#94a3b8;
}

/* ── BODY ── */
body{
  background-color:var(--bg);color:var(--text-primary);
  -webkit-font-smoothing:antialiased;
  transition:background-color .3s,color .3s;
  background-image:
    radial-gradient(circle at 100% 0%,rgba(99,102,241,.15) 0%,transparent 50%),
    radial-gradient(circle at 0% 100%,rgba(168,85,247,.1) 0%,transparent 50%);
  background-attachment:fixed;
}

/* ── GLASS ── */
.glass{
  background:var(--surface);
  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border:1px solid rgba(255,255,255,.05);
  box-shadow:0 10px 25px -5px rgba(0,0,0,.05),0 8px 10px -6px rgba(0,0,0,.05);
}
.dark .glass{
  background:linear-gradient(135deg,rgba(30,41,59,.7) 0%,rgba(15,23,42,.8) 100%);
  border-color:rgba(255,255,255,.1);
}
.card-shadow{box-shadow:0 10px 25px -5px rgba(0,0,0,.05),0 8px 10px -6px rgba(0,0,0,.05)}
.dark .card-shadow{box-shadow:0 20px 40px -12px rgba(0,0,0,.5)}

/* ── SHIMMER skeleton ── */
.shimmer{
  background:linear-gradient(90deg,transparent,rgba(139,92,246,.05),transparent);
  background-size:200% 100%;animation:shimmer 2s infinite;
}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}

/* ── PROGRESS BAR ── */
.progress-bar{transition:width 1s cubic-bezier(.2,.9,.4,1.1)}

/* neon-glow fills */
.pb-green{background:linear-gradient(to right,#86efac,#22c55e,#10b981);box-shadow:0 0 40px rgba(34,197,94,.7)}
.pb-amber{background:linear-gradient(to right,#facc15,#f59e0b,#f97316);box-shadow:0 0 30px rgba(245,158,11,.9)}
.pb-red  {background:linear-gradient(to right,#ef4444,#f43f5e,#e11d48);box-shadow:0 0 35px rgba(225,29,72,.7)}
.dark .pb-green{background:linear-gradient(to right,#34d399,#10b981,#059669);box-shadow:0 0 15px rgba(16,185,129,.3)}
.dark .pb-amber{background:linear-gradient(to right,#facc15,#f59e0b,#d97706);box-shadow:0 0 15px rgba(245,158,11,.4)}
.dark .pb-red  {background:linear-gradient(to right,#f97316,#f43f5e,#e11d48);box-shadow:0 0 25px rgba(255,0,0,.5)}
.pb-track-crit{box-shadow:0 0 20px rgba(244,63,94,.3)!important;border-color:rgba(244,63,94,.3)!important}

/* ── PULSE BADGE (критический остаток) ── */
@keyframes pulse-badge{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.75;transform:scale(1.04)}}
.pulse-badge{animation:pulse-badge 1.5s ease-in-out infinite}

/* ── REMIND DROPDOWN ── */
.remind-panel{overflow:hidden;max-height:0;opacity:0;transition:max-height .35s ease,opacity .25s ease}
.remind-panel.open{max-height:160px;opacity:1}

/* ── TOOLTIP ── */
.has-tip{position:relative}
.has-tip .tip{
  position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);
  background:rgba(15,23,42,.9);color:#fff;font-size:11px;font-weight:700;
  padding:4px 10px;border-radius:8px;white-space:nowrap;
  opacity:0;pointer-events:none;transition:opacity .15s;z-index:10;
}
.has-tip:hover .tip,.has-tip:focus-visible .tip{opacity:1}

/* ── MODAL ── */
.modal{
  display:none;position:fixed;inset:0;
  background:rgba(0,0,0,.55);backdrop-filter:blur(6px);
  align-items:center;justify-content:center;z-index:50;
}
.modal.active{display:flex}
.modal-content{
  background:var(--surface);border-radius:2rem;
  width:min(400px,92vw);padding:1.5rem;
  box-shadow:0 25px 50px -12px rgba(0,0,0,.3);
  max-height:92vh;overflow-y:auto;
}

/* ── TOAST ── */
@keyframes slideUp{from{opacity:0;transform:translate(-50%,20px)}to{opacity:1;transform:translate(-50%,0)}}
.toast{animation:slideUp .3s ease-out}

button{cursor:pointer}
.med-card:hover .med-title{color:#8b5cf6;transition:color .2s}
@keyframes spin{to{transform:rotate(360deg)}}
.spinning{animation:spin .7s linear infinite}
</style>
</head>
<body class="pb-24 px-4 pt-8 max-w-lg mx-auto min-h-screen">

<!-- ══ ШАПКА ══ -->
<header class="flex items-center justify-between mb-10">
  <div>
    <div class="flex items-end gap-2">
      <h1 class="text-3xl font-extrabold tracking-tight"
          style="background:linear-gradient(to right,var(--text-primary),var(--text-secondary));
                 -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text">
        Моя Аптечка
      </h1>
      <span id="appVersionLabel" class="text-[10px] font-thin mb-1" style="color:var(--text-secondary)">—</span>
    </div>
    <p class="text-sm font-medium mt-1" style="color:var(--text-secondary)">Будьте здоровы и не пропускайте приём</p>
  </div>
  <div class="flex items-center gap-2">
    <button id="themeToggle" class="p-2.5 glass rounded-2xl hover:opacity-80 transition-opacity" style="color:var(--text-primary)">
      <svg id="themeIcon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="5"/>
        <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
      </svg>

        <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/>
        <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/>
      </svg>

  </div>
</header>

<!-- ══ СТАТ-КАРТОЧКИ ══ -->
<div class="grid grid-cols-2 gap-4 mb-8">
  <div class="glass p-5 rounded-[2rem] card-shadow">
    <div class="flex items-center gap-3 mb-2">
      <div class="p-2 rounded-xl" style="background:rgba(52,211,153,.1);color:#34d399">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
      </div>
      <span class="text-xs font-bold uppercase tracking-wider" style="color:var(--text-secondary)">Активные</span>
    </div>
    <div id="activeCount" class="text-3xl font-bold" style="color:var(--text-primary)">0</div>
  </div>
  <div class="glass p-5 rounded-[2rem] card-shadow">
    <div class="flex items-center gap-3 mb-2">
      <div class="p-2 rounded-xl" style="background:rgba(251,191,36,.1);color:#fbbf24">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m21 16-4 4-4-4"/><path d="M17 20V4"/><path d="m3 8 4-4 4 4"/><path d="M7 4v16"/></svg>
      </div>
      <span class="text-xs font-bold uppercase tracking-wider" style="color:var(--text-secondary)">Заканчиваются</span>
    </div>
    <div id="expiringCount" class="text-3xl font-bold" style="color:var(--text-primary)">0</div>
  </div>
</div>

<!-- ══ ЭКРАН: АПТЕЧКА ══ -->
<div id="screenMain">
  <div class="flex items-center justify-between mb-6">
    <h2 class="text-xs font-bold uppercase tracking-[.2em] pl-2" style="color:var(--text-secondary)">Текущий график</h2>
    <button id="addMedBtn"
        class="flex items-center gap-1.5 px-4 py-2 rounded-full text-sm font-bold text-white active:scale-95 transition-all"
        style="background:#7c3aed;box-shadow:0 4px 14px rgba(124,58,237,.4)">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
      Добавить

</div>

<div id="screenReminders" style="display:none">

  <div id="remindersList" class="space-y-4"></div>
</div>

<!-- ══ МОДАЛ ДОБАВЛЕНИЯ ══ -->
<div id="addModal" class="modal">
  <div class="modal-content"><div id="wizardContent"></div></div>
</div>

<!-- ══ НИЖНЯЯ ПАНЕЛЬ ══ -->
<div class="fixed bottom-6 left-1/2 -translate-x-1/2 w-full max-w-[calc(512px-32px)] px-4 z-40">
  <div class="glass h-16 rounded-full flex items-center justify-around px-10 shadow-2xl"
       style="border-top:1px solid rgba(255,255,255,.1)">

    <button id="btnMain" class="has-tip transition-colors" style="color:#a78bfa">
      <span class="tip">Аптечка</span>
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M9 3H5a2 2 0 0 0-2 2v4m6-6h10a2 2 0 0 1 2 2v4M9 3v18m0 0h10a2 2 0 0 0 2-2V9M9 21H5a2 2 0 0 1-2-2V9m0 0h18"/>
      </svg>
    </button>

    <button id="btnForecast" class="has-tip transition-colors" style="color:var(--text-secondary)">
      <span class="tip">Прогноз</span>
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/>

      </svg>

    <button id="btnReminders" class="has-tip transition-colors" style="color:var(--text-secondary)">
      <span class="tip">Напоминания</span>
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
      </svg>
    </button>

  </div>
</div>

<!-- ══════════════ JAVASCRIPT ══════════════ -->
<script>
// ── globals ──
let medsData = [];
let wStep = 0, wData = {};
const BASE = ''; // относительные пути — работает на любом хосте
let APP_VER = '—';
const fmtV = u => u + (u.includes('?') ? '&' : '?') + 'v=' + encodeURIComponent(APP_VER);

const FORM_LABELS = {
  tablets:['таблетке','таблеток'], capsules:['капсуле','капсул'],
  liquid:['бутылке','бутылок'],   drops:['флаконе','флаконов'],
  spray:['флаконе','флаконов'],   sachet:['саше','саше']
};

// ── утилиты ──
function esc(s){ return s ? s.replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m])) : ''; }

function toast(msg, err=false){
  document.querySelector('.toast')?.remove();
  const t = document.createElement('div');
  t.className = 'toast fixed bottom-28 left-1/2 -translate-x-1/2 px-5 py-3 rounded-2xl text-white text-sm font-bold z-50 shadow-2xl';
  t.style.cssText = `background:${err ? '#e11d48' : '#10b981'};white-space:nowrap`;
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => {
    t.style.transition = 'all .3s';
    t.style.opacity = '0';
    t.style.transform = 'translate(-50%,20px)';
    setTimeout(() => t.remove(), 300);
  }, 3200);
}

function fmtN(n){
  if (n == null) return '0';
  const num = Number(n);
  return Number.isInteger(num) ? String(num) : num.toFixed(2).replace(/\.00$/, '');
}

const medIcon = f => ({tablets:'💊',capsules:'💊',drops:'💧',spray:'💨',liquid:'🧴',sachet:'📦'}[f] || '💊');
const medCls  = f => ({
  tablets: 'bg-violet-100 text-violet-600 ring-1 ring-violet-200/50 dark:bg-violet-500/10 dark:text-violet-400',
  capsules:'bg-purple-100 text-purple-600 ring-1 ring-purple-200/50 dark:bg-purple-500/10 dark:text-purple-400',
  drops:   'bg-emerald-100 text-emerald-600 ring-1 ring-emerald-200/50 dark:bg-emerald-500/10 dark:text-emerald-400',
  spray:   'bg-amber-100 text-amber-600 ring-1 ring-amber-200/50 dark:bg-amber-500/10 dark:text-amber-400',
  liquid:  'bg-sky-100 text-sky-600 ring-1 ring-sky-200/50 dark:bg-sky-500/10 dark:text-sky-400',
  sachet:  'bg-rose-100 text-rose-600 ring-1 ring-rose-200/50 dark:bg-rose-500/10 dark:text-rose-400',
}[f] || 'bg-slate-100 text-slate-600');

// ══ API-ЗАПРОСЫ ══

async function fetchMeds(){
  const ri = document.getElementById('refreshIcon');
  ri?.classList.add('spinning');
  try {
    const r = await fetch(`${BASE}/api/meds`);
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    medsData = await r.json();
    updateStats();
    renderMeds();
  } catch(e) {
    console.error(e);
    const c = document.getElementById('medsList');
    if (c) c.innerHTML = '<p class="text-center py-10 font-medium" style="color:var(--text-secondary)">Ошибка загрузки данных</p>';
  } finally {
    ri?.classList.remove('spinning');
  }
}

// Нажатие «Выпил» — мгновенно обновляем шкалу без перезагрузки страницы
async function doTake(chatId, name, cardEl){
  try {
    const r = await fetch(`${BASE}/api/taken`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({chat_id: chatId, med_name: name})
    });
    if (!r.ok) throw new Error();
    const d = await r.json();
    toast(d.message || '✅ Приём отмечен!');

    const u = d.updated;
    if (u && Object.keys(u).length && cardEl) {
      // обновляем кэш
      const idx = medsData.findIndex(m => m.name === name && m.chat_id === chatId);
      if (idx !== -1) Object.assign(medsData[idx], u);

      // патч DOM без полного перерендера
      const p   = u.progress ?? 0;
      const med = medsData[idx] || {};
      const un  = med.unit_name ?? 'ед.';
      const rem = fmtN(u.remaining_units);
      const pColor = p >= 80 ? '#f43f5e' : p >= 50 ? '#f59e0b' : '#10b981';

      // шкала
      const bar = cardEl.querySelector('.progress-bar');
      if (bar) {
        bar.className = bar.className.replace(/\bpb-(green|amber|red)\b/g, '');
        bar.classList.add(p >= 80 ? 'pb-red' : p >= 50 ? 'pb-amber' : 'pb-green');
        bar.style.width = p + '%';
      }
      // % текст
      const pTxt = cardEl.querySelector('.pct-label');
      if (pTxt) { pTxt.textContent = p + '%'; pTxt.style.color = pColor; }
      // трек
      const track = cardEl.querySelector('.pb-track');
      if (track) track.classList.toggle('pb-track-crit', p >= 80);
      // бейдж остатка
      const stock = cardEl.querySelector('.stock-badge');
      if (stock) stock.textContent = `Запас: ${rem} ${un}`;
      // индикатор курса
      const cInd = cardEl.querySelector('.course-indicator');
      if (cInd && med) {
        const cd = med.course_days || 0;
        const enough = med.is_enough;
        cInd.textContent = cd === 0 ? `● ЗАПАС: ${rem} ${un}` : (enough ? '● НА КУРС ХВАТИТ' : '● НА КУРС НЕ ХВАТИТ');
        cInd.style.color = (cd === 0 || enough) ? '#10b981' : '#f43f5e';
      }
      // дней осталось
      const dlBadge = cardEl.querySelector('.days-left-badge');
      if (dlBadge) {
        const dl = u.days_left ?? 0;
        dlBadge.textContent = `${dl} дн. ост.`;
        dlBadge.className = dlBadge.className.replace(/\b(bg-rose-500\/10 text-rose-400|bg-emerald-500\/10 text-emerald-400)\b/g, '');
        dlBadge.classList.add(...(dl <= 7 ? ['bg-rose-500/10','text-rose-400'] : ['bg-emerald-500/10','text-emerald-400']));
      }
    } else {
      await fetchMeds();
    }
  } catch {
    toast('❌ Ошибка при отметке приёма', true);
  }
}

async function doStart(chatId, name){
  try {
    const r = await fetch(`${BASE}/api/meds/start`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({chat_id: chatId, med_name: name})
    });
    if (r.ok) { toast(`▶️ Курс «${name}» начат!`); await fetchMeds(); }
    else { const e = await r.json(); toast('❌ ' + (e.detail || 'Ошибка'), true); }
  } catch { toast('❌ Ошибка соединения', true); }
}

async function doDelete(chatId, name){
  if (!confirm(`Удалить «${name}»?`)) return;
  try {
    const r = await fetch(`${BASE}/api/meds?chat_id=${chatId}&med_name=${encodeURIComponent(name)}`, {method:'DELETE'});
    if (r.ok) { toast('🗑 Лекарство удалено'); await fetchMeds(); }
  } catch { toast('❌ Ошибка', true); }
}

async function doRefill(chatId, name){
  const med = medsData.find(m => m.name === name && m.chat_id === chatId);
  const un  = med?.unit_name ?? 'ед.';
  const v   = prompt(`Сколько ${un} докупили?`);
  if (!v || isNaN(parseFloat(v))) return;
  try {
    const r = await fetch(`${BASE}/api/meds/update`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({chat_id: chatId, med_name: name, add_stock: parseFloat(v)})
    });
    const d = await r.json();
    toast(d.message || '🔄 Пополнено!');
    await fetchMeds();
  } catch { toast('❌ Ошибка', true); }
}

async function doDose(chatId, name){
  const med = medsData.find(m => m.name === name && m.chat_id === chatId);
  const un  = med?.unit_name ?? 'ед.';
  const v   = prompt(`Новая суточная дозировка (${un}/сут):`);
  if (!v || isNaN(parseFloat(v))) return;
  // отправляем в мг: daily_units * unit_mg
  const unit_mg   = med?.unit_mg ?? 1;
  const form      = med?.form ?? 'tablets';
  const daily_mg  = (form === 'drops' || form === 'spray') ? parseFloat(v) : parseFloat(v) * unit_mg;
  try {
    const r = await fetch(`${BASE}/api/meds/update`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({chat_id: chatId, med_name: name, daily_mg})
    });
    const d = await r.json();
    toast(d.message || '✅ Дозировка изменена!');
    await fetchMeds();
  } catch { toast('❌ Ошибка', true); }
}

// ── статистика шапки ──
function updateStats(){
  document.getElementById('activeCount').textContent   = medsData.filter(m => m.is_started).length;
  document.getElementById('expiringCount').textContent = medsData.filter(m => m.days_left <= 7 && m.days_left > 0).length;
}

// ── скелетон ──
function showSkeleton(){
  const c = document.getElementById('medsList');
  if (c) c.innerHTML = [0,1,2].map(() => '<div class="glass h-48 rounded-[2.5rem] shimmer"></div>').join('');
}

// ── напоминания-dropdown ──
function toggleRemind(id){ document.getElementById(id)?.classList.toggle('open'); }
function setRemind(label, id){ toast(`⏰ Напоминание через ${label}`); document.getElementById(id)?.classList.remove('open'); }

// ══════════════════════════════════════════════════════
//  РЕНДЕР КАРТОЧЕК (ЭКРАН «АПТЕЧКА»)
// ══════════════════════════════════════════════════════
function renderMeds(){
  const c = document.getElementById('medsList');
  if (!c) return;

  if (!medsData.length) {
    c.innerHTML = `<div class="text-center py-20">
      <div class="w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-6" style="background:var(--surface-hover)">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="opacity:.4;color:var(--text-secondary)">
          <rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/>
        </svg>
      </div>
      <p class="font-medium" style="color:var(--text-secondary)">Лекарства не найдены.<br>Нажмите «Добавить»</p>
    </div>`;
    return;
  }

  c.innerHTML = medsData.map((med, idx) => {
    const p       = med.progress ?? 0;
    const isCrit  = p >= 80;
    const isWarn  = p >= 50;
    const fillCls = isCrit ? 'pb-red' : isWarn ? 'pb-amber' : 'pb-green';
    const pColor  = isCrit ? '#f43f5e' : isWarn ? '#f59e0b' : '#10b981';
    const dl      = med.days_left ?? 0;
    const cd      = med.course_days ?? 0;
    const started = med.is_started;
    const un      = med.unit_name ?? 'ед.';
    const remU    = fmtN(med.remaining_units);
    const dlyU    = fmtN(med.daily_units);

    // подпись прогресса
    const progLabel = cd === 0
      ? 'ЗАПАС ЛЕКАРСТВА'
      : 'ПРОГРЕСС КУРСА';

    // индикатор курса под шкалой
    const cInd  = cd === 0
      ? `● ЗАПАС: ${remU} ${un}`
      : (med.is_enough ? '● НА КУРС ХВАТИТ' : '● НА КУРС НЕ ХВАТИТ');
    const cColor = (cd === 0 || med.is_enough) ? '#10b981' : '#f43f5e';

    // бейдж остатка запаса
    const stockCrit = dl <= 3;
    const stockStyle = stockCrit
      ? 'background:#f43f5e;color:#fff;box-shadow:0 0 15px rgba(244,63,94,.4);'
      : 'background:var(--surface-hover);color:var(--text-secondary);';

    const sn  = esc(med.name).replace(/'/g, "\\'");
    const rid = `remind-${chatSafe(med.chat_id)}-${idx}`;

    return `
<div class="glass rounded-[2.5rem] p-6 relative overflow-hidden med-card" data-idx="${idx}">

  <!-- ── шапка карточки ── -->
  <div class="flex items-start justify-between mb-4">
    <div class="flex items-center gap-4">
      <div class="w-14 h-14 rounded-[1.5rem] flex items-center justify-center relative shadow-lg ${medCls(med.form)}" style="flex-shrink:0">
        <div class="absolute inset-0 rounded-[1.5rem] pointer-events-none" style="background:linear-gradient(135deg,rgba(255,255,255,.4) 0%,rgba(0,0,0,.1) 100%)"></div>
        <span class="relative z-10 text-2xl">${medIcon(med.form)}</span>
      </div>
      <div>
        <h3 class="med-title font-bold text-lg uppercase tracking-tight" style="color:var(--text-primary)">${esc(med.name)}</h3>
        <div class="flex items-center gap-2 mt-0.5">
          <p class="text-sm font-medium" style="color:var(--text-secondary)">${dlyU} ${un}/сут</p>
          <div class="w-1 h-1 rounded-full" style="background:rgba(148,163,184,.35)"></div>
          <p class="text-[11px] font-bold uppercase tracking-wider" style="color:var(--text-secondary)">${cd === 0 ? 'Пожизненно ♾' : `Курс: ${cd} дн.`}</p>
        </div>
      </div>
    </div>
    <div class="flex flex-col items-end gap-2">
      <button onclick="doDelete(${med.chat_id},'${sn}')"
          class="p-2 rounded-xl transition-all" style="color:rgba(244,63,94,.55)"
          onmouseover="this.style.color='#f43f5e';this.style.background='rgba(244,63,94,.1)'"
          onmouseout="this.style.color='rgba(244,63,94,.55)';this.style.background=''">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 4V3c0-1 1-2 2-2h4c1 0 2 1 2 2v1"/></svg>
      </button>
      <div class="days-left-badge px-3 py-1 rounded-full text-[10px] font-bold uppercase tracking-wider ${dl <= 7 ? 'bg-rose-500/10 text-rose-400' : 'bg-emerald-500/10 text-emerald-400'}">${dl} дн. ост.</div>
      ${started ? `<div class="px-2 py-0.5 rounded-md text-[9px] font-black uppercase flex items-center gap-1" style="background:rgba(16,185,129,.1);color:#10b981"><div class="w-1 h-1 rounded-full animate-pulse" style="background:#10b981"></div>КУРС НАЧАТ</div>` : ''}
    </div>
  </div>

  <!-- ── прогресс-шкала ── -->
  <div class="mb-6">
    <div class="flex justify-between text-[11px] font-extrabold uppercase tracking-widest mb-3" style="color:var(--text-secondary)">
      <span class="flex items-center gap-1.5 opacity-90">
        <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="${pColor}" stroke-width="2.5"><path d="m21 16-4 4-4-4"/><path d="M17 20V4"/><path d="m3 8 4-4 4 4"/><path d="M7 4v16"/></svg>
        ${progLabel}
      </span>
      <span class="text-sm font-black pct-label" style="color:${pColor}">${p}%</span>
    </div>

    <!-- трек -->
    <div class="pb-track h-6 w-full rounded-full relative p-1 border shadow-inner ${isCrit ? 'pb-track-crit' : ''}"
         style="background:rgba(148,163,184,.15);border-color:rgba(0,0,0,.03);overflow:hidden">
      <!-- заливка: стартует с 0%, анимируется до p% через setTimeout -->
      <div class="progress-bar h-full rounded-full ${fillCls} relative flex items-center justify-end pr-0.5"
           data-progress="${p}" style="width:0%">
        <!-- глянцевый блик -->
        <div class="absolute inset-x-0 top-0 h-1/2 rounded-t-full pointer-events-none" style="background:rgba(255,255,255,.22)"></div>
        <!-- конечная точка -->
        <div class="w-3 h-3 rounded-full border border-white/40 flex items-center justify-center shrink-0"
             style="background:rgba(255,255,255,.3);backdrop-filter:blur(4px)">
          <div class="w-1 h-1 rounded-full" style="background:rgba(255,255,255,.9)"></div>
        </div>
      </div>
    </div>

    ${isCrit ? '<p class="text-[10px] font-bold mt-2 uppercase tracking-tighter text-right" style="color:#f43f5e">⚠ Запас почти исчерпан!</p>' : ''}
    <div class="course-indicator mt-2 text-[11px] font-extrabold uppercase tracking-tight" style="color:${cColor}">${cInd}</div>
  </div>

  <!-- ── расписание + остаток ── -->
  <div class="flex items-center justify-between mb-6">
    <div class="flex items-center gap-2 text-xs font-bold px-4 py-2 rounded-2xl" style="background:var(--btn-secondary);color:var(--text-secondary);border:1px solid rgba(255,255,255,.1)">
      <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#8b5cf6" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      ${esc(med.schedule || 'не указано')}
    </div>
    <div class="stock-badge text-[11px] font-extrabold uppercase tracking-tight px-3 py-1.5 rounded-xl ${stockCrit ? 'pulse-badge' : ''}"
         style="${stockStyle}">Запас: ${remU} ${un}</div>
  </div>

  <!-- ── Пополнить + Дозировка ── -->
  <div class="grid grid-cols-2 gap-3 mb-4">
    <button onclick="doRefill(${med.chat_id},'${sn}')"
        class="flex items-center justify-center gap-2 py-3 rounded-2xl text-sm font-bold transition-all"
        style="background:var(--btn-secondary);color:var(--text-secondary);border:1px solid rgba(255,255,255,.1)"
        onmouseover="this.style.color='#10b981';this.style.borderColor='rgba(16,185,129,.25)'"
        onmouseout="this.style.color='var(--text-secondary)';this.style.borderColor='rgba(255,255,255,.1)'">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
      Пополнить
    </button>
    <button onclick="doDose(${med.chat_id},'${sn}')"
        class="flex items-center justify-center gap-2 py-3 rounded-2xl text-sm font-bold transition-all"
        style="background:var(--btn-secondary);color:var(--text-secondary);border:1px solid rgba(255,255,255,.1)"
        onmouseover="this.style.color='#8b5cf6';this.style.borderColor='rgba(139,92,246,.25)'"
        onmouseout="this.style.color='var(--text-secondary)';this.style.borderColor='rgba(255,255,255,.1)'">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33-1.82 2 2 0 0 1 0-2.36 1.65 1.65 0 0 0-.33-1.82 1.65 1.65 0 0 0-1.82-.33 2 2 0 0 1-2.36 0 1.65 1.65 0 0 0-1.82.33 2 2 0 0 1-2.36 0 1.65 1.65 0 0 0-1.82-.33 2 2 0 0 1-2.36 0 1.65 1.65 0 0 0-1.82.33 1.65 1.65 0 0 0-.33 1.82 2 2 0 0 1 0 2.36 1.65 1.65 0 0 0 .33 1.82 1.65 1.65 0 0 0 1.82.33 2 2 0 0 1 2.36 0 1.65 1.65 0 0 0 1.82.33 2 2 0 0 1 2.36 0 1.65 1.65 0 0 0 1.82.33 1.65 1.65 0 0 0 .33-1.82z"/></svg>
      Дозировка
    </button>
  </div>

  <!-- ── главная CTA ── -->
  ${!started
    ? `<button onclick="doStart(${med.chat_id},'${sn}')"
           class="w-full text-white font-extrabold py-4 rounded-3xl flex items-center justify-center gap-2 hover:brightness-110 active:scale-95 transition-all"
           style="background:#10b981;box-shadow:0 10px 25px -5px rgba(16,185,129,.35)">
         <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>
         Начать курс
       </button>`
    : `<div class="space-y-3">
         <div class="flex gap-2">
           <button onclick="doTake(${med.chat_id},'${sn}',this.closest('.med-card'))" ${dl <= 0 ? 'disabled' : ''}
               class="flex-1 text-white font-extrabold py-4 rounded-3xl flex items-center justify-center gap-2 hover:brightness-110 active:scale-95 transition-all disabled:opacity-40"
               style="background:#7c3aed;box-shadow:0 20px 40px -12px rgba(124,58,237,.55)">
             <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
             Выпил
           </button>
           <button onclick="toggleRemind('${rid}')"
               class="flex-1 text-white font-extrabold py-4 rounded-3xl flex items-center justify-center gap-2 hover:brightness-110 active:scale-95 transition-all"
               style="background:#7c3aed;box-shadow:0 20px 40px -12px rgba(124,58,237,.55)">
             <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
             Напомнить позже
           </button>
         </div>
         <div id="${rid}" class="remind-panel">
           <div class="grid grid-cols-4 gap-2 pt-2">
             ${['10 мин','20 мин','30 мин','1 час'].map(l => `
             <button onclick="setRemind('${l}','${rid}')"
                 class="py-2.5 rounded-xl text-xs font-bold transition-all"
                 style="background:rgba(139,92,246,.1);color:#a78bfa;border:1px solid rgba(139,92,246,.2)"
                 onmouseover="this.style.background='rgba(139,92,246,.22)'"
                 onmouseout="this.style.background='rgba(139,92,246,.1)'">${l}</button>`).join('')}
           </div>
         </div>
       </div>`
  }
</div>`;
  }).join('');

  // анимируем шкалы — рендерим с 0%, через 60мс устанавливаем реальное значение
  setTimeout(() => {
    c.querySelectorAll('.progress-bar[data-progress]').forEach(bar => {
      bar.style.width = bar.dataset.progress + '%';
    });
  }, 60);
}

function chatSafe(id){ return String(id).replace(/\D/g,''); }

// ══════════════════════════════════════════════════════
//  ЭКРАН «ПРОГНОЗ»
// ══════════════════════════════════════════════════════
function renderForecast(){
  const c = document.getElementById('forecastList');
  if (!c) return;
  if (!medsData.length) {
    c.innerHTML = '<p class="text-center py-10 font-medium" style="color:var(--text-secondary)">Лекарства не найдены.</p>';
    return;
  }

  c.innerHTML = medsData.map(med => {
    const dl   = med.days_left ?? 0;
    const cd   = med.course_days ?? 0;
    const un   = med.unit_name ?? 'ед.';
    const remU = fmtN(med.remaining_units);
    const dlyU = fmtN(med.daily_units);
    const prog = med.progress ?? 0;
    const pColor = prog >= 80 ? '#f43f5e' : prog >= 50 ? '#f59e0b' : '#10b981';
    const status = med.is_started ? '▶️ Идёт приём' : '⏸ Ожидание старта';

    // блок «хватит ли до конца курса»
    let enoughHtml = '';
    if (cd > 0 && med.is_started) {
      const ok = med.is_enough;
      enoughHtml = `
        <div class="flex items-center gap-2 px-4 py-2.5 rounded-xl text-sm font-bold mt-2"
             style="background:${ok ? 'rgba(16,185,129,.1)' : 'rgba(244,63,94,.1)'};color:${ok ? '#10b981' : '#f43f5e'}">
          ${ok ? '✅ Запаса хватит до конца курса' : '❌ Запаса НЕ хватит до конца курса'}
        </div>`;
    }

    const endRow = med.end_date ? `
      <div class="flex justify-between text-sm py-1">
        <span style="color:var(--text-secondary)">Конец курса:</span>
        <span class="font-bold" style="color:var(--text-primary)">${med.end_date}</span>
      </div>` : '';

    const cdLeftRow = (cd > 0 && med.course_days_left != null) ? `
      <div class="flex justify-between text-sm py-1">
        <span style="color:var(--text-secondary)">Осталось дней курса:</span>
        <span class="font-bold" style="color:var(--text-primary)">${med.course_days_left}</span>
      </div>` : '';

    return `
<div class="glass rounded-[2rem] p-5 card-shadow">
  <div class="flex items-center gap-4 mb-4">
    <div class="w-12 h-12 rounded-[1.2rem] flex items-center justify-center text-2xl ${medCls(med.form)}">${medIcon(med.form)}</div>
    <div class="flex-1">
      <div class="font-bold text-base uppercase tracking-tight" style="color:var(--text-primary)">${esc(med.name)}</div>
      <div class="text-xs font-medium mt-0.5" style="color:var(--text-secondary)">${status}</div>
    </div>
    <div class="px-3 py-1 rounded-full text-xs font-bold ${dl <= 7 ? 'bg-rose-500/10 text-rose-400' : 'bg-emerald-500/10 text-emerald-400'}">${dl} дн.</div>
  </div>

  <!-- мини-шкала -->
  <div class="mb-4">
    <div class="flex justify-between text-[10px] font-bold uppercase tracking-widest mb-1.5" style="color:var(--text-secondary)">
      <span>${cd === 0 ? 'Запас израсходован' : 'Прогресс курса'}</span>
      <span style="color:${pColor}">${prog}%</span>
    </div>
    <div class="h-3 w-full rounded-full overflow-hidden" style="background:rgba(148,163,184,.2)">
      <div class="h-full rounded-full" style="width:${prog}%;background:linear-gradient(to right,${prog>=80?'#ef4444,#f43f5e':prog>=50?'#facc15,#f59e0b':'#86efac,#10b981'})"></div>
    </div>
  </div>

  <!-- детали -->
  <div class="space-y-0.5 px-1">
    <div class="flex justify-between text-sm py-1">
      <span style="color:var(--text-secondary)">Режим:</span>
      <span class="font-bold" style="color:var(--text-primary)">${cd === 0 ? 'Пожизненный ♾' : `Курс ${cd} дн.`}</span>
    </div>
    <div class="flex justify-between text-sm py-1">
      <span style="color:var(--text-secondary)">Остаток:</span>
      <span class="font-bold" style="color:var(--text-primary)">${remU} ${un}</span>
    </div>
    <div class="flex justify-between text-sm py-1">
      <span style="color:var(--text-secondary)">Расход в сутки:</span>
      <span class="font-bold" style="color:var(--text-primary)">${dlyU} ${un}/сут</span>
    </div>
    <div class="flex justify-between text-sm py-1.5 border-t font-black text-base" style="border-color:rgba(148,163,184,.15)">
      <span style="color:var(--text-secondary)">Запаса хватит на:</span>
      <span style="color:var(--text-primary)">${dl} дней</span>
    </div>
    ${endRow}${cdLeftRow}
  </div>
  ${enoughHtml}
</div>`;
  }).join('');
}

// ══════════════════════════════════════════════════════
//  ЭКРАН «НАПОМИНАНИЯ»
// ══════════════════════════════════════════════════════
function renderReminders(){
  const c = document.getElementById('remindersList');
  if (!c) return;
  if (!medsData.length) {
    c.innerHTML = '<p class="text-center py-10 font-medium" style="color:var(--text-secondary)">Лекарства не найдены.</p>';
    return;
  }

  const DAY = {
    'Everyday':'Каждый день','Weekdays':'Будни','Weekends':'Выходные',
    '0':'Пн','1':'Вт','2':'Ср','3':'Чт','4':'Пт','5':'Сб','6':'Вс'
  };

  c.innerHTML = medsData.map(med => {
    const times   = med.times ?? {};
    const un      = med.unit_name ?? 'ед.';
    const dlyU    = fmtN(med.daily_units);
    const hasT    = Object.values(times).some(t => Array.isArray(t) && t.length);
    const sn      = esc(med.name).replace(/'/g, "\\'");

    const timesHtml = hasT
      ? Object.entries(times)
          .filter(([, t]) => Array.isArray(t) && t.length)
          .map(([dk, t]) => `
            <div class="flex items-center justify-between py-2 border-b last:border-0" style="border-color:rgba(148,163,184,.15)">
              <span class="text-sm font-semibold" style="color:var(--text-secondary)">${DAY[dk] ?? dk}</span>
              <div class="flex flex-wrap gap-1.5">
                ${t.map(time => `<span class="px-2.5 py-1 rounded-lg text-xs font-black" style="background:rgba(139,92,246,.12);color:#a78bfa">${time}</span>`).join('')}
              </div>
            </div>`).join('')
      : '<p class="py-3 text-sm font-medium" style="color:rgba(148,163,184,.6)">Расписание не установлено в боте</p>';

    return `
<div class="glass rounded-[2rem] p-5 card-shadow">
  <div class="flex items-center gap-4 mb-3">
    <div class="w-12 h-12 rounded-[1.2rem] flex items-center justify-center text-2xl ${medCls(med.form)}">${medIcon(med.form)}</div>
    <div class="flex-1">
      <div class="font-bold uppercase tracking-tight" style="color:var(--text-primary)">${esc(med.name)}</div>
      <div class="text-xs font-medium mt-0.5" style="color:var(--text-secondary)">${dlyU} ${un}/сут · ${med.is_started ? '▶️ приём идёт' : '⏸ не начат'}</div>
    </div>
  </div>
  <div class="mb-3">${timesHtml}</div>
  ${med.is_started ? `
  <button onclick="doTake(${med.chat_id},'${sn}',null)"
      class="w-full text-white font-bold py-3 rounded-2xl flex items-center justify-center gap-2 hover:brightness-110 active:scale-95 transition-all text-sm"
      style="background:#7c3aed;box-shadow:0 10px 25px -5px rgba(124,58,237,.3)">
    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
    Выпил
  </button>` : ''}
</div>`;
  }).join('');
}

// ══════════════════════════════════════════════════════
//  НАВИГАЦИЯ
// ══════════════════════════════════════════════════════
function showScreen(id){
  ['screenMain','screenForecast','screenReminders'].forEach(s => {
    document.getElementById(s).style.display = 'none';
  });
  document.getElementById(id).style.display = 'block';
  const nav = {screenMain:'btnMain', screenForecast:'btnForecast', screenReminders:'btnReminders'};
  Object.entries(nav).forEach(([s, b]) => {
    document.getElementById(b).style.color = s === id ? '#a78bfa' : 'var(--text-secondary)';
  });
  if (id === 'screenForecast')  renderForecast();
  if (id === 'screenReminders') renderReminders();
}

// ══════════════════════════════════════════════════════
//  ТЕМА
// ══════════════════════════════════════════════════════
function initTheme(){
  const s    = localStorage.getItem('theme');
  const dark = s === 'dark' || (s === null && matchMedia('(prefers-color-scheme:dark)').matches);
  document.documentElement.classList.toggle('dark', dark);
  setThemeIcon(dark);
}
function setThemeIcon(dark){
  const ic = document.getElementById('themeIcon');
  if (!ic) return;
  ic.innerHTML = dark
    ? '<circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>'
    : '<path d="M21 12.79A9 9 0 1 1 11.21 3a7 7 0 0 0 9.79 9.79z"/>';
}
function toggleTheme(){
  const d = document.documentElement.classList.toggle('dark');
  localStorage.setItem('theme', d ? 'dark' : 'light');
  setThemeIcon(d);
}

// ══════════════════════════════════════════════════════
//  МАСТЕР ДОБАВЛЕНИЯ ЛЕКАРСТВА
// ══════════════════════════════════════════════════════
function openWizard(){ wStep = 0; wData = {}; document.getElementById('addModal').classList.add('active'); renderWizard(); }
function closeWizard(){ document.getElementById('addModal').classList.remove('active'); }

function renderWizard(){
  const wc  = document.getElementById('wizardContent');
  const BS  = 'background:var(--btn-secondary);color:var(--text-primary)';
  const INP = 'w-full p-3 rounded-xl mb-4 border-0 outline-none text-sm font-medium';

  if (wStep === 0){
    wc.innerHTML = `
      <h3 class="text-xl font-bold mb-4" style="color:var(--text-primary)">Новое лекарство</h3>
      <input id="wName" type="text" placeholder="Название" class="${INP}" style="background:var(--surface-hover);color:var(--text-primary)">
      <div class="flex gap-3">
        <button id="wNext" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white py-3 rounded-xl font-bold transition-colors">Далее</button>
        <button onclick="closeWizard()" class="flex-1 bg-rose-600 hover:bg-rose-700 text-white py-3 rounded-xl font-bold transition-colors">Отмена</button>
      </div>`;
    document.getElementById('wNext').onclick = () => {
      const n = document.getElementById('wName').value.trim();
      if (!n){ toast('❌ Введите название', true); return; }
      wData.name = n; wStep = 1; renderWizard();
    };

  } else if (wStep === 1){
    wc.innerHTML = `
      <h3 class="text-xl font-bold mb-4" style="color:var(--text-primary)">Форма выпуска</h3>
      <div class="grid grid-cols-2 gap-3 mb-4">
        ${[['tablets','💊 Таблетки'],['capsules','💊 Капсулы'],['drops','👁 Капли'],
           ['spray','💨 Спрей'],['sachet','📦 Саше'],['liquid','🧴 Жидкость']].map(([f,l]) =>
          `<button data-form="${f}" class="wForm p-3 rounded-xl font-medium hover:bg-violet-500/20 transition-colors" style="${BS}">${l}</button>`).join('')}
      </div>
      <button id="wBack" class="w-full p-3 rounded-xl font-bold transition-colors" style="${BS}">Назад</button>`;
    wc.querySelectorAll('.wForm').forEach(b => {
      b.onclick = () => { wData.form = b.dataset.form; wStep = 2; renderWizard(); };
    });
    document.getElementById('wBack').onclick = () => { wStep = 0; renderWizard(); };

  } else if (wStep === 2){
    const f   = wData.form;
    const lab = FORM_LABELS[f] || ['единице','единиц'];
    const q   = f==='drops' ? 'Объём флакона (мл)?'
              : f==='spray' ? 'Сколько мл в 1 флаконе?'
              : f==='liquid'? 'Сколько мл в 1 единице?'
              : `Сколько мг в 1 ${lab[0]}?`;
    wc.innerHTML = `
      <h3 class="text-xl font-bold mb-4" style="color:var(--text-primary)">${q}</h3>
      <input id="wUnitMg" type="number" step="any" min="0.001" class="${INP}" style="background:var(--surface-hover);color:var(--text-primary)">
      <div class="flex gap-3">
        <button id="wNext" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white py-3 rounded-xl font-bold">Далее</button>
        <button id="wBack" class="flex-1 py-3 rounded-xl font-bold" style="${BS}">Назад</button>
      </div>`;
    document.getElementById('wNext').onclick = () => {
      const v = parseFloat(document.getElementById('wUnitMg').value);
      if (isNaN(v) || v <= 0){ toast('❌ Введите корректное значение', true); return; }
      wData.unit_mg = v; wStep = 3; renderWizard();
    };
    document.getElementById('wBack').onclick = () => { wStep = 1; renderWizard(); };

  } else if (wStep === 3){
    const pl = FORM_LABELS[wData.form]?.[1] || 'единиц';
    wc.innerHTML = `
      <h3 class="text-xl font-bold mb-4" style="color:var(--text-primary)">Сколько ${pl} купили?</h3>
      <input id="wUnits" type="number" step="any" min="1" class="${INP}" style="background:var(--surface-hover);color:var(--text-primary)">
      <div class="flex gap-3">
        <button id="wNext" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white py-3 rounded-xl font-bold">Далее</button>
        <button id="wBack" class="flex-1 py-3 rounded-xl font-bold" style="${BS}">Назад</button>
      </div>`;
    document.getElementById('wNext').onclick = () => {
      const v = parseFloat(document.getElementById('wUnits').value);
      if (isNaN(v) || v <= 0){ toast('❌ Укажите количество', true); return; }
      wData.units = v; wStep = 4; renderWizard();
    };
    document.getElementById('wBack').onclick = () => { wStep = 2; renderWizard(); };

  } else if (wStep === 4){
    const f  = wData.form;
    const un = {'drops':'капель','spray':'впрыскиваний','liquid':'мл','tablets':'таблеток','capsules':'капсул','sachet':'саше'}[f] || 'штук';
    wc.innerHTML = `
      <h3 class="text-xl font-bold mb-4" style="color:var(--text-primary)">Сколько ${un} в сутки принимать?</h3>
      <input id="wDaily" type="number" step="any" min="0.1" class="${INP}" style="background:var(--surface-hover);color:var(--text-primary)">
      <div class="flex gap-3">
        <button id="wNext" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white py-3 rounded-xl font-bold">Далее</button>
        <button id="wBack" class="flex-1 py-3 rounded-xl font-bold" style="${BS}">Назад</button>
      </div>`;
    document.getElementById('wNext').onclick = () => {
      const v = parseFloat(document.getElementById('wDaily').value);
      if (isNaN(v) || v <= 0){ toast('❌ Укажите дозировку', true); return; }
      wData.daily_units = v; wStep = 5; renderWizard();
    };
    document.getElementById('wBack').onclick = () => { wStep = 3; renderWizard(); };

  } else if (wStep === 5){
    wc.innerHTML = `
      <h3 class="text-xl font-bold mb-4" style="color:var(--text-primary)">Срок приёма</h3>
      <div class="grid gap-3 mb-4">
        <button id="wDays"    class="p-3 rounded-xl font-medium hover:bg-emerald-500/20 transition-colors" style="${BS}">📆 Количество дней</button>
        <button id="wMonths"  class="p-3 rounded-xl font-medium hover:bg-emerald-500/20 transition-colors" style="${BS}">🗓 Количество месяцев</button>
        <button id="wForever" class="p-3 rounded-xl font-medium hover:bg-emerald-500/20 transition-colors" style="${BS}">♾ Пожизненно</button>
      </div>
      <button id="wBack" class="w-full p-3 rounded-xl font-bold" style="${BS}">Назад</button>`;
    document.getElementById('wDays').onclick    = () => showCourseInput('days');
    document.getElementById('wMonths').onclick  = () => showCourseInput('months');
    document.getElementById('wForever').onclick = () => { wData.course_days = 0; finishWizard(); };
    document.getElementById('wBack').onclick    = () => { wStep = 4; renderWizard(); };

    function showCourseInput(type){
      const unit = type === 'months' ? 'месяцев' : 'дней';
      wc.innerHTML = `
        <h3 class="text-xl font-bold mb-4" style="color:var(--text-primary)">Введите количество ${unit}</h3>
        <input id="wCourse" type="number" min="1" class="${INP}" style="background:var(--surface-hover);color:var(--text-primary)">
        <div class="flex gap-3">
          <button id="wConfirm" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white py-3 rounded-xl font-bold">Сохранить</button>
          <button id="wBack2"   class="flex-1 py-3 rounded-xl font-bold" style="${BS}">Назад</button>
        </div>`;
      document.getElementById('wConfirm').onclick = () => {
        let v = parseInt(document.getElementById('wCourse').value);
        if (isNaN(v) || v <= 0){ toast('❌ Введите количество', true); return; }
        if (type === 'months') v *= 30;
        wData.course_days = v;
        finishWizard();
      };
      document.getElementById('wBack2').onclick = () => { wStep = 5; renderWizard(); };
    }
  }
}

async function finishWizard(){
  try {
    // Проверяем все обязательные поля перед отправкой
    if (!wData.name || !wData.form || !wData.unit_mg || !wData.units || !wData.daily_units) {
      console.error('finishWizard: неполные данные', wData);
      toast('❌ Заполните все поля', true);
      return;
    }

    const form     = wData.form;
    const unit_mg  = Number(wData.unit_mg);
    // daily_mg во внутренних единицах (мг/капли/впрыскивания)
    const daily_mg = (form === 'drops' || form === 'spray')
      ? Number(wData.daily_units)
      : Number(wData.daily_units) * unit_mg;

    const payload = {
      name:        wData.name.trim(),
      form,
      unit_mg,
      units:       Number(wData.units),
      daily_mg,
      course_days: Number(wData.course_days || 0),
      chat_id:     Number(medsData?.[0]?.chat_id ?? 0),
    };

    const url = `${BASE}/api/meds/add`;
    console.log('finishWizard → POST', url, payload);

    let r;
    try {
      r = await fetch(url, {
        method:  'POST',
        headers: {'Content-Type': 'application/json'},
        body:    JSON.stringify(payload),
      });
    } catch(fetchErr) {
      console.error('fetch failed:', fetchErr);
      toast(`❌ Сервер недоступен (${BASE})`, true);
      return;
    }

    const responseText = await r.text();
    console.log('finishWizard ←', r.status, responseText);

    if (r.ok) {
      let msg = '✅ Лекарство успешно добавлено!';
      try { const d = JSON.parse(responseText); msg = d.message || msg; } catch {}
      toast(msg);
      closeWizard();
      await fetchMeds();
    } else {
      let detail = `Ошибка сервера (${r.status})`;
      try { const e = JSON.parse(responseText); detail = e.detail || detail; } catch {}
      toast('❌ ' + detail, true);
    }
  } catch(e) {
    console.error('finishWizard exception:', e);
    toast('❌ Неизвестная ошибка: ' + e.message, true);
  }
}

// ══════════════════════════════════════════════════════
//  ВЕРСИЯ
// ══════════════════════════════════════════════════════
async function syncVersion(){
  try {
    const r = await fetch(fmtV(`${BASE}/api/version`), {cache:'no-store'});
    if (!r.ok) return;
    const d = await r.json();
    if (d?.version){
      APP_VER = String(d.version);
      const el = document.getElementById('appVersionLabel');
      if (el) el.textContent = APP_VER;
    }
  } catch(e){ console.warn(e); }
}

// ══════════════════════════════════════════════════════
//  ИНИЦИАЛИЗАЦИЯ
// ══════════════════════════════════════════════════════
document.getElementById('themeToggle').onclick   = toggleTheme;
document.getElementById('refreshBtn').onclick    = () => { showSkeleton(); fetchMeds(); };
document.getElementById('addMedBtn').onclick     = openWizard;
document.getElementById('btnMain').onclick       = () => showScreen('screenMain');
document.getElementById('btnForecast').onclick   = () => showScreen('screenForecast');
document.getElementById('btnReminders').onclick  = () => showScreen('screenReminders');
document.getElementById('addModal').onclick = e => {
  if (e.target === document.getElementById('addModal')) closeWizard();
};

initTheme();
showSkeleton();
syncVersion();
fetchMeds();
setInterval(fetchMeds, 30000);
</script>
