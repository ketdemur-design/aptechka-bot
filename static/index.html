<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Моя Аптечка</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
        * { font-family: 'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif; }
        body {
            background: var(--bg);
            color: var(--text-primary);
            transition: background-color 0.3s ease, color 0.3s ease;
            background-image: radial-gradient(circle at 100% 0%, rgba(99,102,241,0.15) 0%, transparent 50%),
                              radial-gradient(circle at 0% 100%, rgba(168,85,247,0.1) 0%, transparent 50%);
            background-attachment: fixed;
        }
        :root {
            --bg: #e2e8f0;
            --surface: #ffffff;
            --surface-hover: #f1f5f9;
            --btn-secondary: #cbd5e1;
            --text-primary: #0f172a;
            --text-secondary: #475569;
        }
        .dark {
            --bg: #090b11;
            --surface: #1a1f2e;
            --surface-hover: #252b3d;
            --btn-secondary: #2d3446;
            --text-primary: #ffffff;
            --text-secondary: #94a3b8;
        }
        .glass {
            background: var(--surface);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.05);
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05), 0 8px 10px -6px rgba(0,0,0,0.05);
        }
        .dark .glass {
            background: linear-gradient(135deg, rgba(30,41,59,0.7) 0%, rgba(15,23,42,0.8) 100%);
            border-color: rgba(255,255,255,0.1);
        }
        .card-shadow { box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05), 0 8px 10px -6px rgba(0,0,0,0.05); }
        .dark .card-shadow { box-shadow: 0 20px 40px -12px rgba(0,0,0,0.5); }
        .progress-bar { transition: width 0.8s cubic-bezier(0.2, 0.9, 0.4, 1.1); }
        .btn-secondary { background-color: var(--btn-secondary); }
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(4px);
            align-items: center;
            justify-content: center;
            z-index: 50;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: var(--surface);
            border-radius: 2rem;
            max-width: 90%;
            width: 400px;
            padding: 1.5rem;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
            max-height: 80vh;
            overflow-y: auto;
        }
        .step-hidden { display: none; }
        .course-btn {
            padding: 10px;
            margin: 5px;
            border-radius: 12px;
            background: var(--btn-secondary);
            cursor: pointer;
        }
    </style>
</head>
<body class="pb-20 px-4 pt-8 max-w-lg mx-auto">
    <header class="flex items-center justify-between mb-10">
        <div>
            <h1 class="text-3xl font-extrabold tracking-tight bg-gradient-to-r from-[var(--text-primary)] to-[var(--text-secondary)] bg-clip-text text-transparent">
                Мои лекарства
            </h1>
            <p class="text-[var(--text-secondary)] text-sm font-medium mt-1">Будьте здоровы и не пропускайте приём</p>
        </div>
        <div class="flex items-center gap-2">
            <button id="themeToggle" class="p-2.5 glass rounded-2xl hover:bg-[var(--surface-hover)] transition-colors group">
                <svg id="themeIcon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
            </button>
            <button id="refreshBtn" class="p-2.5 glass rounded-2xl hover:bg-[var(--surface-hover)] transition-colors group">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
            </button>
        </div>
    </header>

    <div class="grid grid-cols-2 gap-4 mb-8">
        <div class="glass p-5 rounded-[2rem] card-shadow">
            <div class="flex items-center gap-3 mb-2">
                <div class="p-2 bg-emerald-400/10 rounded-xl text-emerald-400">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
                </div>
                <span class="text-[var(--text-secondary)] text-xs font-bold uppercase tracking-wider">Активные</span>
            </div>
            <div id="activeCount" class="text-3xl font-bold text-[var(--text-primary)]">0</div>
        </div>
        <div class="glass p-5 rounded-[2rem] card-shadow">
            <div class="flex items-center gap-3 mb-2">
                <div class="p-2 bg-amber-400/10 rounded-xl text-amber-400">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m21 16-4 4-4-4"/><path d="M17 20V4"/><path d="m3 8 4-4 4 4"/><path d="M7 4v16"/></svg>
                </div>
                <span class="text-[var(--text-secondary)] text-xs font-bold uppercase tracking-wider">Заканчиваются</span>
            </div>
            <div id="expiringCount" class="text-3xl font-bold text-[var(--text-primary)]">0</div>
        </div>
    </div>

    <div class="flex items-center justify-between mb-6">
        <h2 class="text-xs font-bold text-[var(--text-secondary)] uppercase tracking-[0.2em] pl-2">Текущий график</h2>
        <button id="addMedBtn" class="bg-violet-600 text-white px-4 py-2 rounded-full text-sm font-bold flex items-center gap-1 shadow-lg hover:bg-violet-700 transition">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
            Добавить
        </button>
    </div>

    <div id="medsList" class="space-y-4"></div>

    <!-- Модальное окно добавления лекарства (многошаговое) -->
    <div id="addModal" class="modal">
        <div class="modal-content">
            <h3 class="text-xl font-bold mb-4 text-[var(--text-primary)]">Новое лекарство</h3>
            
            <!-- Шаг 1: Название -->
            <div id="step1" class="step">
                <input type="text" id="medName" placeholder="Название лекарства" class="w-full p-3 rounded-xl bg-[var(--surface-hover)] text-[var(--text-primary)] mb-3 border border-white/10">
                <button id="nextStep1" class="w-full bg-violet-600 text-white py-3 rounded-xl font-bold">Далее</button>
            </div>
            
            <!-- Шаг 2: Форма -->
            <div id="step2" class="step-hidden">
                <p class="mb-3 font-bold">Выберите форму:</p>
                <div class="grid grid-cols-2 gap-2 mb-4">
                    <button data-form="tablets" class="form-select-btn p-3 rounded-xl bg-[var(--surface-hover)] hover:bg-violet-600 hover:text-white transition">💊 Таблетки</button>
                    <button data-form="capsules" class="form-select-btn p-3 rounded-xl bg-[var(--surface-hover)] hover:bg-violet-600 hover:text-white transition">💊 Капсулы</button>
                    <button data-form="drops" class="form-select-btn p-3 rounded-xl bg-[var(--surface-hover)] hover:bg-violet-600 hover:text-white transition">💧 Капли</button>
                    <button data-form="spray" class="form-select-btn p-3 rounded-xl bg-[var(--surface-hover)] hover:bg-violet-600 hover:text-white transition">💨 Спрей</button>
                    <button data-form="liquid" class="form-select-btn p-3 rounded-xl bg-[var(--surface-hover)] hover:bg-violet-600 hover:text-white transition">🧴 Жидкость</button>
                    <button data-form="sachet" class="form-select-btn p-3 rounded-xl bg-[var(--surface-hover)] hover:bg-violet-600 hover:text-white transition">📦 Саше</button>
                </div>
                <button id="backStep2" class="w-full bg-gray-500 text-white py-3 rounded-xl font-bold">Назад</button>
            </div>
            
            <!-- Шаг 3: Дозировка единицы (зависит от формы) -->
            <div id="step3" class="step-hidden">
                <p id="unitQuestion" class="mb-3">Сколько мг в одной единице?</p>
                <input type="number" id="medUnitMg" step="any" placeholder="Введите значение" class="w-full p-3 rounded-xl bg-[var(--surface-hover)] text-[var(--text-primary)] mb-3 border border-white/10">
                <button id="nextStep3" class="w-full bg-violet-600 text-white py-3 rounded-xl font-bold">Далее</button>
                <button id="backStep3" class="w-full bg-gray-500 text-white py-3 rounded-xl font-bold mt-2">Назад</button>
            </div>
            
            <!-- Шаг 4: Количество единиц -->
            <div id="step4" class="step-hidden">
                <p id="unitsQuestion" class="mb-3">Сколько единиц купили?</p>
                <input type="number" id="medUnits" placeholder="Введите количество" class="w-full p-3 rounded-xl bg-[var(--surface-hover)] text-[var(--text-primary)] mb-3 border border-white/10">
                <button id="nextStep4" class="w-full bg-violet-600 text-white py-3 rounded-xl font-bold">Далее</button>
                <button id="backStep4" class="w-full bg-gray-500 text-white py-3 rounded-xl font-bold mt-2">Назад</button>
            </div>
            
            <!-- Шаг 5: Суточная дозировка -->
            <div id="step5" class="step-hidden">
                <p id="dailyQuestion" class="mb-3">Сколько в сутки назначено?</p>
                <input type="number" id="medDailyMg" step="any" placeholder="Введите дозировку" class="w-full p-3 rounded-xl bg-[var(--surface-hover)] text-[var(--text-primary)] mb-3 border border-white/10">
                <button id="nextStep5" class="w-full bg-violet-600 text-white py-3 rounded-xl font-bold">Далее</button>
                <button id="backStep5" class="w-full bg-gray-500 text-white py-3 rounded-xl font-bold mt-2">Назад</button>
            </div>
            
            <!-- Шаг 6: Срок курса -->
            <div id="step6" class="step-hidden">
                <p class="mb-3 font-bold">Срок приёма:</p>
                <div class="grid grid-cols-1 gap-2 mb-4">
                    <button id="courseDays" class="course-option p-3 rounded-xl bg-[var(--surface-hover)] hover:bg-violet-600 hover:text-white transition">📆 Дни</button>
                    <button id="courseMonths" class="course-option p-3 rounded-xl bg-[var(--surface-hover)] hover:bg-violet-600 hover:text-white transition">🗓 Месяцы (30 дней)</button>
                    <button id="courseForever" class="course-option p-3 rounded-xl bg-[var(--surface-hover)] hover:bg-violet-600 hover:text-white transition">♾ Пожизненно</button>
                </div>
                <div id="courseValueInput" class="hidden">
                    <input type="number" id="courseValue" placeholder="Введите количество" class="w-full p-3 rounded-xl bg-[var(--surface-hover)] text-[var(--text-primary)] mb-3 border border-white/10">
                    <button id="submitCourse" class="w-full bg-green-600 text-white py-3 rounded-xl font-bold">Сохранить</button>
                </div>
                <button id="backStep6" class="w-full bg-gray-500 text-white py-3 rounded-xl font-bold mt-2">Назад</button>
            </div>
        </div>
    </div>

    <script>
        let medsData = [];
        let addState = {
            step: 1,
            name: '',
            form: '',
            unit_mg: null,
            units: null,
            daily_mg: null,
            course_type: null,
            course_value: null
        };

        const medsContainer = document.getElementById('medsList');
        const activeCountSpan = document.getElementById('activeCount');
        const expiringCountSpan = document.getElementById('expiringCount');
        const refreshBtn = document.getElementById('refreshBtn');
        const themeToggle = document.getElementById('themeToggle');
        const addMedBtn = document.getElementById('addMedBtn');
        const addModal = document.getElementById('addModal');

        // Шаги
        const step1 = document.getElementById('step1');
        const step2 = document.getElementById('step2');
        const step3 = document.getElementById('step3');
        const step4 = document.getElementById('step4');
        const step5 = document.getElementById('step5');
        const step6 = document.getElementById('step6');

        function showStep(step) {
            step1.classList.add('step-hidden');
            step2.classList.add('step-hidden');
            step3.classList.add('step-hidden');
            step4.classList.add('step-hidden');
            step5.classList.add('step-hidden');
            step6.classList.add('step-hidden');
            
            if (step === 1) step1.classList.remove('step-hidden');
            else if (step === 2) step2.classList.remove('step-hidden');
            else if (step === 3) step3.classList.remove('step-hidden');
            else if (step === 4) step4.classList.remove('step-hidden');
            else if (step === 5) step5.classList.remove('step-hidden');
            else if (step === 6) step6.classList.remove('step-hidden');
        }

        function updateUnitQuestion() {
            const q = document.getElementById('unitQuestion');
            if (addState.form === 'drops') q.textContent = 'Объем флакона (мл)?';
            else if (addState.form === 'spray') q.textContent = 'Сколько мл в одной единице?';
            else if (addState.form === 'liquid') q.textContent = 'Сколько мл в одной единице?';
            else q.textContent = 'Сколько мг в одной единице?';
        }

        function updateUnitsQuestion() {
            const q = document.getElementById('unitsQuestion');
            const labels = { tablets: 'таблеток', capsules: 'капсул', drops: 'флаконов', spray: 'флаконов', liquid: 'бутылок', sachet: 'саше' };
            q.textContent = `Сколько ${labels[addState.form] || 'единиц'} купили?`;
        }

        function updateDailyQuestion() {
            const q = document.getElementById('dailyQuestion');
            if (addState.form === 'drops') q.textContent = 'Сколько капель в сутки назначено?';
            else if (addState.form === 'spray') q.textContent = 'Сколько впрыскиваний в сутки назначено?';
            else if (addState.form === 'liquid') q.textContent = 'Сколько мл в сутки назначено?';
            else q.textContent = 'Сколько мг в сутки принимаете?';
        }

        // Обработчики шагов
        document.getElementById('nextStep1').onclick = () => {
            const name = document.getElementById('medName').value.trim();
            if (!name) { alert('Введите название'); return; }
            addState.name = name;
            addState.step = 2;
            showStep(2);
        };

        document.querySelectorAll('.form-select-btn').forEach(btn => {
            btn.onclick = () => {
                addState.form = btn.dataset.form;
                addState.step = 3;
                updateUnitQuestion();
                showStep(3);
            };
        });

        document.getElementById('nextStep3').onclick = () => {
            const val = parseFloat(document.getElementById('medUnitMg').value);
            if (isNaN(val)) { alert('Введите значение'); return; }
            addState.unit_mg = val;
            addState.step = 4;
            updateUnitsQuestion();
            showStep(4);
        };

        document.getElementById('nextStep4').onclick = () => {
            const val = parseInt(document.getElementById('medUnits').value);
            if (isNaN(val)) { alert('Введите количество'); return; }
            addState.units = val;
            addState.step = 5;
            updateDailyQuestion();
            showStep(5);
        };

        document.getElementById('nextStep5').onclick = () => {
            const val = parseFloat(document.getElementById('medDailyMg').value);
            if (isNaN(val)) { alert('Введите дозировку'); return; }
            addState.daily_mg = val;
            addState.step = 6;
            showStep(6);
            document.getElementById('courseValueInput').classList.add('hidden');
        };

        // Кнопки назад
        document.getElementById('backStep2').onclick = () => { addState.step = 1; showStep(1); };
        document.getElementById('backStep3').onclick = () => { addState.step = 2; showStep(2); };
        document.getElementById('backStep4').onclick = () => { addState.step = 3; showStep(3); };
        document.getElementById('backStep5').onclick = () => { addState.step = 4; showStep(4); };
        document.getElementById('backStep6').onclick = () => { addState.step = 5; showStep(5); };

        // Выбор курса
        document.getElementById('courseDays').onclick = () => {
            addState.course_type = 'days';
            document.getElementById('courseValueInput').classList.remove('hidden');
            document.getElementById('submitCourse').onclick = () => {
                const val = parseInt(document.getElementById('courseValue').value);
                if (isNaN(val)) { alert('Введите количество дней'); return; }
                addState.course_value = val;
                addMedicine();
            };
        };
        
        document.getElementById('courseMonths').onclick = () => {
            addState.course_type = 'months';
            document.getElementById('courseValueInput').classList.remove('hidden');
            document.getElementById('submitCourse').onclick = () => {
                const val = parseInt(document.getElementById('courseValue').value);
                if (isNaN(val)) { alert('Введите количество месяцев'); return; }
                addState.course_value = val * 30;
                addMedicine();
            };
        };
        
        document.getElementById('courseForever').onclick = () => {
            addState.course_value = 0;
            addMedicine();
        };

        async function addMedicine() {
            const medData = {
                name: addState.name,
                form: addState.form,
                unit_mg: addState.unit_mg,
                units: addState.units,
                daily_mg: addState.daily_mg,
                course_days: addState.course_value
            };
            
            try {
                const res = await fetch('/api/meds/add', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(medData)
                });
                if (res.ok) {
                    await fetchMeds();
                    addModal.classList.remove('active');
                    // Сброс состояния
                    addState = { step: 1, name: '', form: '', unit_mg: null, units: null, daily_mg: null, course_type: null, course_value: null };
                    document.getElementById('medName').value = '';
                    document.getElementById('medUnitMg').value = '';
                    document.getElementById('medUnits').value = '';
                    document.getElementById('medDailyMg').value = '';
                    document.getElementById('courseValue').value = '';
                    showStep(1);
                } else {
                    const err = await res.json();
                    alert('Ошибка: ' + (err.error || 'неизвестная'));
                }
            } catch (err) {
                console.error(err);
                alert('Ошибка соединения');
            }
        }

        // Тема
        function initTheme() {
            const saved = localStorage.getItem('theme');
            const isDark = saved === 'dark' || (saved === null && window.matchMedia('(prefers-color-scheme: dark)').matches);
            if (isDark) document.documentElement.classList.add('dark');
            else document.documentElement.classList.remove('dark');
            updateThemeIcon();
        }
        function toggleTheme() {
            document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
            updateThemeIcon();
        }
        function updateThemeIcon() {
            const isDark = document.documentElement.classList.contains('dark');
            const icon = document.getElementById('themeIcon');
            if (isDark) {
                icon.outerHTML = `<svg id="themeIcon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="text-[var(--text-primary)] group-hover:text-amber-400"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>`;
            } else {
                icon.outerHTML = `<svg id="themeIcon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="text-[var(--text-primary)] group-hover:text-amber-400"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>`;
            }
        }
        themeToggle.addEventListener('click', toggleTheme);

        // API вызовы (остальные функции такие же как в предыдущей версии)
        async function fetchMeds() {
            try {
                const res = await fetch('/api/meds', { cache: 'no-store' });
                if (!res.ok) throw new Error('Network error');
                medsData = await res.json();
                updateStats();
                renderMeds();
            } catch (err) {
                console.error(err);
                medsContainer.innerHTML = '<div class="text-center py-10 text-[var(--text-secondary)]">Ошибка загрузки данных</div>';
            }
        }

        function updateStats() {
            const active = medsData.filter(m => m.is_started).length;
            const expiring = medsData.filter(m => m.days_left <= 7 && m.days_left > 0).length;
            activeCountSpan.innerText = active;
            expiringCountSpan.innerText = expiring;
        }

        function getFormIcon(form) {
            const icons = { tablets: '💊', capsules: '💊', drops: '💧', spray: '💨', liquid: '🧴', sachet: '📦' };
            return icons[form] || '💊';
        }

        function getFormColor(form) {
            const colors = {
                tablets: 'bg-violet-100 text-violet-600 dark:bg-violet-500/10 dark:text-violet-400',
                capsules: 'bg-purple-100 text-purple-600 dark:bg-purple-500/10 dark:text-purple-400',
                drops: 'bg-emerald-100 text-emerald-600 dark:bg-emerald-500/10 dark:text-emerald-400',
                spray: 'bg-amber-100 text-amber-600 dark:bg-amber-500/10 dark:text-amber-400',
                liquid: 'bg-sky-100 text-sky-600 dark:bg-sky-500/10 dark:text-sky-400',
                sachet: 'bg-rose-100 text-rose-600 dark:bg-rose-500/10 dark:text-rose-400'
            };
            return colors[form] || 'bg-slate-100 text-slate-600 dark:bg-slate-800/50 dark:text-slate-400';
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        function renderMeds() {
            if (!medsContainer) return;
            if (medsData.length === 0) {
